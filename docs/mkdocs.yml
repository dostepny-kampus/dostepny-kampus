site_name: Dostępny Kampus — dokumentacja
site_description: Inwentaryzacja barier architektonicznych na kampusie Politechniki Wrocławskiej
site_author: Vladyslav Yevkov
copyright: Copyright &copy; 2026 Vladyslav Yevkov, Myroslav Hryniuka, Yevhenii Lukianenko
docs_dir: docs
strict: true

theme:
  name: material
  language: pl
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.tabs.link
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Tryb ciemny
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Tryb jasny

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      auto_append:
        - docs/includes/slownik-skroty.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

exclude_docs: |
  includes/

nav:
  - Start: index.md
  - Biznes:
      - Wizja: biznes/wizja.md
      - Role i uprawnienia: biznes/role.md
      - Słownik pojęć: biznes/slownik.md
      - Proces AS-IS: biznes/procesy/as-is.md
      - Proces TO-BE: biznes/procesy/to-be.md
      - Reguły biznesowe: biznes/reguly.md
      - Ryzyka: biznes/ryzyka.md
  - Wymagania:
      - Potrzeby i historyjki: wymagania/potrzeby-i-historie.md
      - Przypadki użycia: wymagania/przypadki-uzycia.md
      - Wymagania niefunkcjonalne: wymagania/niefunkcjonalne.md
      - Macierz śledzenia: wymagania/sledzenie.md
  - UX:
      - Scenariusz wywiadu: ux/scenariusz-wywiadu.md
      - Persony: ux/persony.md
      - Mapy ścieżki: ux/journey.md
      - Analiza SWOT: ux/swot.md
      - QFD — potrzeby a funkcje: ux/qfd.md
      - Wymagania do ekranów: ux/wymagania-ekranow.md
      - Mapa nawigacji: ux/mapa-nawigacji.md
      - Słownik użytkownika: ux/slownik-uzytkownika.md
      - Makiety:
          - Konwencje: ux/makiety/index.md
          - Odwiedzający: ux/makiety/odwiedzajacy.md
          - Zespół w terenie: ux/makiety/zespol-w-terenie.md
          - Weryfikacja i koordynacja: ux/makiety/weryfikacja-koordynacja.md
      - Tokeny wizualne: ux/tokeny.md
  - Architektura:
      - architektura/index.md
      - Kontekst systemu: architektura/kontekst.md
      - Kontenery: architektura/kontenery.md
      - Decyzje:
          - ADR-0001 Stos technologiczny: architektura/decyzje/0001-stos-technologiczny.md
          - ADR-0002 Jedno repozytorium: architektura/decyzje/0002-monorepo.md
          - ADR-0003 Keycloak: architektura/decyzje/0003-keycloak.md
          - ADR-0004 Gotowe reguły i biblioteki: architektura/decyzje/0004-gotowe-reguly-i-biblioteki.md
          - ADR-0005 Mapa bez sieci: architektura/decyzje/0005-mapa-offline.md
          - ADR-0006 Dane PWr o pomieszczeniach: architektura/decyzje/0006-dane-pwr-o-pomieszczeniach.md
  - Raporty:
      - Tydzień 2: raporty/tydzien-2.md
      - Sprint 1: raporty/sprint-1.md
