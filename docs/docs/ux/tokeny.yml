# Dostępny Kampus — tokeny wizualne (jedno źródło prawdy).
#
# Z tego pliku faza C generuje motyw aplikacji: schemat kolorów jasny i ciemny,
# skalę typografii i stałe wymiarów. Strona docs/ux/tokeny.md pokazuje te same
# wartości w tabelach wygenerowanych skryptem.
#
# Po każdej zmianie:
#   python scripts/kontrast.py --page docs/ux/tokeny.md   (sprawdza i odświeża tabele strony)
#   python scripts/verify.py                               (krok „kontrast” sprawdza progi i aktualność strony)
#
# Pola `uzycie` i `zrodlo` trafiają do tabel na stronie. Komentarze wyjaśniają wybór wartości.
# Kolory: zapis #RRGGBB, bez przezroczystości (kontrast liczymy dla koloru kryjącego).
# Rozmiary tekstu w sp, a wszystkie inne wymiary w dp.

wersja: 1

# ---------------------------------------------------------------------------
# Kolory — nazwy ról Material 3. Wartości ze stylu „Karta miejsca” (decyzja projektu
# nr 48). Tylko role, których potrzebują ekrany.
# Zasady (NFR-21, wymagania wspólne fazy B, decyzja 48 pkt 3):
#   * Kolor nie niesie znaczenia. Oznaczenie wejścia (Dostępne / Niedostępne /
#     Brak danych) ma zawsze kształt ikony i słowo ze słownika użytkownika.
#     Może stać w spokojnym, przyciemnionym kontenerze, ale znaczenie niosą kształt
#     i słowo, a nie barwa kontenera.
#   * Uciążliwość (Utrudnienie / Tylko z pomocą / Blokada) i status zgłoszenia nie mają
#     własnego kontenera: tekst i ikona w kolorze zwykłego tekstu.
#   * Bez „sygnalizacji świetlnej”: w palecie interfejsu nie ma zielonego ani żółtego,
#     więc nie ma pary zielony/czerwony. Kontenery statusów różnią się jasnością
#     i odcieniem w osi morski–szaroróżowy.
#   * Jedna barwa akcentu: ciemny morski (petrol). Daltonizm czerwono-zielony
#     (protanopia, deuteranopia) nie zmienia odbioru tej osi; skrypt sprawdza kontrast
#     także po symulacji obu typów.
#   * Ciemny motyw dobrany osobno, a nie przez odwrócenie jasnego.
# ---------------------------------------------------------------------------
kolory:
  surface:
    jasny: "#F5FAFC"   # bardzo jasny, lekko chłodny; białe są tylko kontenery grup
    ciemny: "#161B1D"  # ciemnoszare, nie czarne: mniej rażące przejścia przy jasnym tekście (Material, motyw ciemny)
    uzycie: nagłówek z polem wyszukiwania (V1), przypięty pasek czynności, pasek „Wstecz” po przewinięciu, tło pól tekstowych
    zrodlo: NFR-16, styl „Karta miejsca”
  surfaceContainerLowest:
    jasny: "#FFFFFF"   # białe kontenery na szarym arkuszu zastępują linie podziału
    ciemny: "#1E2427"
    uzycie: kontenery grup („Wejścia”, „Winda i toaleta”, „Piętra”, stan pusty barier), pływające kontrolki mapy, legenda, chipy
    zrodlo: NFR-16, styl „Karta miejsca”
  surfaceContainerLow:
    jasny: "#EFF4F6"
    ciemny: "#1A1F21"
    uzycie: pole wyszukiwania, pasek dolny nawigacji
    zrodlo: styl „Karta miejsca”
  surfaceContainer:
    jasny: "#E8EEF0"   # tło arkusza: o ton ciemniejsze niż kontenery grup, by grupy odcinały się bez ramek
    ciemny: "#0F1314"
    uzycie: tło arkusza z kartą budynku (V2) i arkusza na mapie (V1)
    zrodlo: styl „Karta miejsca”
  surfaceVariant:
    # W stylu „Karta miejsca” ten ton nazywa się surface-container-high.
    jasny: "#DCE2E4"
    ciemny: "#2A3033"
    uzycie: tło fragmentu mapy przed wczytaniem, ramka komunikatu i wskaźnika braku internetu
    zrodlo: NFR-16, styl „Karta miejsca”
  onSurface:
    jasny: "#161C1E"   # prawie czarny; ≥ 14:1 na każdym tle
    ciemny: "#E8EEF0"  # jasnoszary zamiast czystej bieli, by tekst nie „świecił” na ciemnym tle
    uzycie: tekst podstawowy, nazwa budynku, nagłówki grup, ikony i napisy uciążliwości oraz statusów zgłoszeń
    zrodlo: NFR-16, NFR-21
  onSurfaceVariant:
    jasny: "#3A4549"   # tekst drugorzędny wciąż ≥ 7:1, bo źródło i data oceny wejść są ważne (US17.3)
    ciemny: "#BCC9CD"
    uzycie: tekst drugorzędny (źródło i data, „Zalecane, parter”, podpisy), napisy i ikony paska dolnego
    zrodlo: NFR-16, US17.3
  outline:
    jasny: "#6A7579"   # ≥ 3:1 na każdym tle: ramka pola, chipu i przycisku obrysowanego wyznacza granicę celu dotyku
    ciemny: "#8A969A"
    uzycie: obramowanie pola wyszukiwania, chipów, przycisków obrysowanych i segmentów
    zrodlo: NFR-16 (WCAG 1.4.11)
  primary:
    jasny: "#004E5E"   # ciemny morski: jedyny kolor akcentu
    ciemny: "#85D1EA"  # w ciemnym motywie jaśniejszy i mniej nasycony; nasycony kolor na ciemnym tle drga
    uzycie: symbol budynku, jedyny przycisk wypełniony na ekranie, przyciski tekstowe („Zgłoś problem”, „Pokaż na planie”), wskaźnik fokusu
    zrodlo: wymagania wspólne (czynność główna), NFR-16
  onPrimary:
    jasny: "#FFFFFF"
    ciemny: "#002933"  # ciemny morski na jasnym akcencie; biel dawałaby za mały kontrast
    uzycie: napis i ikona na przycisku wypełnionym, np. „Sprawdź, którędy wejść”
    zrodlo: NFR-16
  primaryContainer:
    jasny: "#C3E9F6"   # tylko to, co wybrane: osoba widzi, gdzie jest
    ciemny: "#0E4655"
    uzycie: wybrane piętro, wybrany widok i pozycja paska dolnego, plakietka budynku
    zrodlo: styl „Karta miejsca”
  onPrimaryContainer:
    jasny: "#001F27"
    ciemny: "#D3F2FC"
    uzycie: napis na wybranym elemencie i obwódka 2 dp wybranego piętra
    zrodlo: NFR-16
  secondaryContainer:
    jasny: "#D5E7ED"
    ciemny: "#2A434B"
    uzycie: przyciski tonalne, np. „Zgłoś barierę”, „Pokaż na mapie”
    zrodlo: styl „Karta miejsca”
  onSecondaryContainer:
    jasny: "#1C3640"
    ciemny: "#D3EEF7"
    uzycie: napis i ikona przycisku tonalnego
    zrodlo: NFR-16
  # Kontenery oznaczeń wejścia (decyzja 48 pkt 3). Znaczenie niesie kształt ikony i słowo;
  # ten sam kształt mają znaczniki wejść na mapie. Kształt rysuje kolor `on…Container`.
  statusDostepneContainer:
    # Kształt: koło ze znakiem ✓, słowo „Dostępne”.
    jasny: "#CDE8F0"   # spokojny morski
    ciemny: "#1C4350"
    uzycie: tło oznaczenia „Dostępne” przy wejściu i chipu „Wejście dostępne”
    zrodlo: NFR-21, US2.1, decyzja 48
  onStatusDostepneContainer:
    jasny: "#00313C"
    ciemny: "#D5F2FB"
    uzycie: słowo „Dostępne” i ikona koła ze znakiem ✓
    zrodlo: NFR-16, NFR-21
  statusNiedostepneContainer:
    # Kształt: ośmiokąt ze znakiem ✕, słowo „Niedostępne”.
    jasny: "#F2DFE4"   # przygaszony szaroróżowy, nie czerwony
    ciemny: "#4A2733"
    uzycie: tło oznaczenia „Niedostępne” przy wejściu
    zrodlo: NFR-21, US2.1, decyzja 48
  onStatusNiedostepneContainer:
    jasny: "#4A1B2A"
    ciemny: "#FFDDE6"
    uzycie: słowo „Niedostępne” i ikona ośmiokąta ze znakiem ✕
    zrodlo: NFR-16, NFR-21
  statusBrakDanychContainer:
    # Kształt: romb ze znakiem ?, słowo „Brak danych”.
    jasny: "#E3E5E6"   # neutralny szary
    ciemny: "#33393C"
    uzycie: tło oznaczenia „Brak danych” przy wejściu i w legendzie mapy
    zrodlo: NFR-21, US2.1, decyzja 48
  onStatusBrakDanychContainer:
    jasny: "#2A2E30"
    ciemny: "#E2E6E8"
    uzycie: słowo „Brak danych” i ikona rombu ze znakiem ?
    zrodlo: NFR-16, NFR-21
  error:
    # Ciemna czerwień tylko dla błędu walidacji: przy polu i w podsumowaniu nad formularzem
    # (C2, C6, C7, R2). Zawsze z pogrubionym tekstem, który mówi, co się stało i co zrobić
    # (wymagania wspólne fazy B). Błąd serwera, zapisu, logowania i brak internetu to zwykły
    # komunikat: onSurface na surfaceVariant, bez czerwieni. Styl „Karta miejsca” nie ma
    # formularzy, więc wartość zostaje z poprzedniej wersji pliku.
    jasny: "#8A0F18"
    ciemny: "#FFB3AE"  # jasny łososiowy; na ciemnym tle ≥ 7:1
    uzycie: tekst błędu walidacji przy polu i nad formularzem, obramowanie pola z błędem; nigdy dla oznaczenia wejścia, statusu ani uciążliwości
    zrodlo: NFR-15 (WCAG 3.3.1), NFR-21

# ---------------------------------------------------------------------------
# Kontrast — pary sprawdzane przez scripts/kontrast.py dla obu motywów,
# także po symulacji protanopii i deuteranopii.
# ---------------------------------------------------------------------------
kontrast:
  progi:
    # NFR-16 wymaga 4,5:1. Przyjmujemy 7:1 (WCAG 1.4.6, poziom AAA) dla każdego tekstu,
    # także dużego: PE-1 słabo czyta blady tekst w słońcu, PE-2 pracuje w słońcu,
    # PE-3 czyta drobny tekst z wysiłkiem. Skrypt odrzuca próg niższy niż w NFR-16.
    tekst: 7.0
    # NFR-16 i WCAG 1.4.11: ramki pól, ikony statusu, fokus, granica przycisku.
    komponent: 3.0
  pary:
    - {kolor: onSurface, tlo: surface, rodzaj: tekst, gdzie: "nagłówek V1, pasek czynności, pola"}
    - {kolor: onSurface, tlo: surfaceContainer, rodzaj: tekst, gdzie: "nazwa budynku i nagłówki grup na arkuszu"}
    - {kolor: onSurface, tlo: surfaceContainerLowest, rodzaj: tekst, gdzie: "treść w kontenerach grup, kontrolki mapy, legenda"}
    - {kolor: onSurface, tlo: surfaceContainerLow, rodzaj: tekst, gdzie: "pole wyszukiwania, pasek dolny"}
    - {kolor: onSurface, tlo: surfaceVariant, rodzaj: tekst, gdzie: "komunikat i wskaźnik braku internetu"}
    - {kolor: onSurfaceVariant, tlo: surfaceContainer, rodzaj: tekst, gdzie: "źródło i data na arkuszu"}
    - {kolor: onSurfaceVariant, tlo: surfaceContainerLowest, rodzaj: tekst, gdzie: "„Zalecane, parter”, podpis mapy"}
    - {kolor: onSurfaceVariant, tlo: surfaceContainerLow, rodzaj: tekst, gdzie: "podpowiedź w polu, napisy paska dolnego"}
    - {kolor: onSurfaceVariant, tlo: surfaceVariant, rodzaj: tekst, gdzie: "data przy wskaźniku braku internetu"}
    - {kolor: primary, tlo: surfaceContainer, rodzaj: tekst, gdzie: "symbol budynku na arkuszu"}
    - {kolor: primary, tlo: surfaceContainerLowest, rodzaj: tekst, gdzie: "przyciski tekstowe w kontenerach grup"}
    - {kolor: primary, tlo: surface, rodzaj: tekst, gdzie: "„Wstecz”, przycisk obrysowany"}
    - {kolor: onPrimary, tlo: primary, rodzaj: tekst, gdzie: "przycisk wypełniony"}
    - {kolor: onPrimaryContainer, tlo: primaryContainer, rodzaj: tekst, gdzie: "wybrane piętro, plakietka budynku"}
    - {kolor: onSecondaryContainer, tlo: secondaryContainer, rodzaj: tekst, gdzie: "przycisk tonalny"}
    - {kolor: onStatusDostepneContainer, tlo: statusDostepneContainer, rodzaj: tekst, gdzie: "„Dostępne” i koło ze znakiem ✓"}
    - {kolor: onStatusNiedostepneContainer, tlo: statusNiedostepneContainer, rodzaj: tekst, gdzie: "„Niedostępne” i ośmiokąt ze znakiem ✕"}
    - {kolor: onStatusBrakDanychContainer, tlo: statusBrakDanychContainer, rodzaj: tekst, gdzie: "„Brak danych” i romb ze znakiem ?"}
    - {kolor: error, tlo: surface, rodzaj: tekst, gdzie: "błąd przy polu"}
    - {kolor: error, tlo: surfaceContainerLowest, rodzaj: tekst, gdzie: "błąd przy polu w kontenerze grupy"}
    - {kolor: outline, tlo: surface, rodzaj: komponent, gdzie: "obramowanie pola i przycisku obrysowanego"}
    - {kolor: outline, tlo: surfaceContainer, rodzaj: komponent, gdzie: "obramowanie chipu na arkuszu"}
    - {kolor: outline, tlo: surfaceContainerLowest, rodzaj: komponent, gdzie: "obramowanie chipu w kontenerze"}
    - {kolor: outline, tlo: surfaceVariant, rodzaj: komponent, gdzie: "obramowanie ramki komunikatu"}
    - {kolor: primary, tlo: surface, rodzaj: komponent, gdzie: "granica przycisku wypełnionego, fokus"}

# ---------------------------------------------------------------------------
# Typografia — rozmiary w sp, żeby tekst rósł z ustawieniem czcionki (NFR-20, WCAG 1.4.4).
# Krój systemowy: osoba zachowuje krój i rozmiar ustawiony w telefonie (PE-1 ma
# powiększoną czcionkę), a aplikacja nie dołącza pliku czcionki.
# Interlinia tekstu podstawowego ≈ 1,5 rozmiaru (WCAG 1.4.8, poziom AAA).
# ---------------------------------------------------------------------------
typografia:
  kroj: systemowy
  # Żaden tekst w aplikacji nie jest mniejszy (próg zespołu). Skrypt sprawdza każdy styl.
  minimum_sp: 16
  # Pogrubienie czynności głównej i błędu przy polu (makiety: przycisk główny, błąd pola).
  wyroznienie_waga: 700
  style:
    titleLarge:
      sp: 24
      waga: 700
      interlinia_sp: 32
      uzycie: nagłówek ekranu, np. „Budynek A-1”
      zrodlo: NFR-16 (duży tekst ≥ 24 sp)
    titleMedium:
      sp: 20
      waga: 700
      interlinia_sp: 28
      uzycie: nagłówek sekcji, np. „Bariery w budynku”
      zrodlo: NFR-16 (duży tekst ≥ 19 sp pogrubiony)
    bodyLarge:
      sp: 18             # 34 znaki w wierszu na ekranie 360 dp (konwencja makiet)
      waga: 400
      interlinia_sp: 28
      uzycie: tekst podstawowy, oznaczenia, statusy, data i źródło przy wejściu
      zrodlo: konwencje makiet, NFR-20, PE-1
    labelLarge:
      sp: 18
      waga: 500
      interlinia_sp: 24
      uzycie: napis przycisku; czynność główna ma wagę wyróżnienia
      zrodlo: konwencje makiet, NFR-17
    bodyMedium:
      sp: 16
      waga: 400
      interlinia_sp: 24
      uzycie: podpis źródła pod planem piętra, podpis OpenStreetMap na mapie
      zrodlo: NFR-37, NFR-40, minimum zespołu
    labelMedium:
      sp: 16
      waga: 500
      interlinia_sp: 22
      uzycie: napisy pod ikonami paska dolnego, w razie potrzeby w dwóch wierszach
      zrodlo: wymagania wspólne (pasek dolny), minimum zespołu

# ---------------------------------------------------------------------------
# Wymiary w dp. Odstępy na siatce 4 dp (Material 3); skrypt sprawdza wielokrotność.
# ---------------------------------------------------------------------------
siatka_dp: 4

odstepy:
  xs:
    dp: 4
    uzycie: odstęp ikony od napisu
    zrodlo: siatka 4 dp
  s:
    dp: 8
    uzycie: odstęp tekstu od ramki wewnątrz pozycji listy
    zrodlo: siatka 4 dp
  m:
    dp: 16             # 360 dp − 2 × 16 dp zostawia 328 dp na wiersz tekstu 18 sp
    uzycie: margines boczny ekranu, odstęp między przyciskami i pozycjami listy
    zrodlo: konwencje makiet, PE-1 (drżenie dłoni)
  l:
    dp: 24
    uzycie: odstęp między sekcjami ekranu
    zrodlo: siatka 4 dp

cele_dotyku:
  minimum:
    dp: 48
    uzycie: najmniejszy cel dotyku, także ikona paska dolnego i pole wyboru z etykietą
    zrodlo: NFR-17
  przycisk:
    dp: 56             # zapas ponad 48 dp: PE-1 ma lekkie drżenie dłoni i chybia małe przyciski
    uzycie: najmniejsza wysokość przycisku z napisem; przy dużej czcionce rośnie razem z tekstem
    zrodlo: NFR-17, NFR-20, PE-1
  odstep:
    dp: 8
    uzycie: najmniejszy odstęp między dwoma osobnymi celami dotyku; między przyciskami stosujemy odstęp m
    zrodlo: wytyczne Material dla celów dotyku

obramowania:
  ramka:
    dp: 2              # 1 dp znika w słońcu; ramka wyznacza granicę celu (PE-1, PE-2)
    uzycie: obramowanie pól, ramek pozycji listy i przycisków drugorzędnych
    zrodlo: NFR-16 (WCAG 1.4.11)
  fokus:
    dp: 3
    uzycie: wskaźnik fokusu klawiatury, w kolorze `primary`, 2 dp od elementu; ramkę fokusu TalkBack rysuje system
    zrodlo: NFR-15 (WCAG 2.4.7), NFR-16

zaokraglenia:
  standard:
    dp: 8              # jedno zaokrąglenie dla przycisku, pola i ramki: kształt przycisku jest przewidywalny
    uzycie: przyciski, pola, ramki pozycji i komunikatów
    zrodlo: heurystyka Nielsena 4 (spójność)

ikony:
  rozmiar:
    dp: 24
    uzycie: ikona statusu, oznaczenia i paska dolnego, zawsze z napisem obok
    zrodlo: NFR-21, słownik użytkownika (Metafory i ikony)
