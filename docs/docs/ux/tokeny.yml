# Dostępny Kampus — tokeny wizualne (jedno źródło prawdy).
#
# Z tego pliku faza C generuje motyw aplikacji: schemat kolorów jasny i ciemny,
# skalę typografii i stałe wymiarów. Strona docs/ux/tokeny.md pokazuje te same
# wartości w tabelach wygenerowanych skryptem.
#
# Po każdej zmianie:
#   python scripts/kontrast.py --page docs/ux/tokeny.md   (sprawdza i odświeża tabele strony)
#   python scripts/verify.py                               (krok „kontrast” sprawdza progi i aktualność strony)
#
# Pola `uzycie` i `zrodlo` trafiają do tabel na stronie. Komentarze wyjaśniają wybór wartości.
# Kolory: zapis #RRGGBB, bez przezroczystości (kontrast liczymy dla koloru kryjącego).
# Rozmiary tekstu w sp, a wszystkie inne wymiary w dp.

wersja: 1

# ---------------------------------------------------------------------------
# Kolory — nazwy ról Material 3. Wartości ze stylu „Karta miejsca” (decyzja projektu
# nr 48). Tylko role, których potrzebują ekrany.
# Zasady (NFR-21, wymagania wspólne fazy B, decyzja 48 pkt 3):
#   * Kolor nie niesie znaczenia. Oznaczenie wejścia (Dostępne / Niedostępne /
#     Brak danych) ma zawsze kształt ikony i słowo ze słownika użytkownika.
#     Może stać w spokojnym, lekko zabarwionym kontenerze, ale znaczenie niosą kształt
#     i słowo, a nie barwa kontenera.
#   * Uciążliwość (Utrudnienie / Tylko z pomocą / Blokada) i status zgłoszenia nie mają
#     własnego kontenera: tekst i ikona w kolorze zwykłego tekstu.
#   * Bez „sygnalizacji świetlnej”: w palecie interfejsu nie ma zielonego ani żółtego,
#     więc nie ma pary zielony/czerwony. Kontenery statusów różnią się odcieniem
#     (morski, szaroróżowy, szary), a jasność mają prawie równą: w odcieniach szarości
#     odróżnia je tylko kształt i słowo.
#   * Jedna barwa akcentu: ciemny morski (petrol). Daltonizm czerwono-zielony
#     (protanopia, deuteranopia) nie zmienia odbioru tej osi; skrypt sprawdza kontrast
#     także po symulacji obu typów.
#   * Ciemny motyw dobrany osobno, a nie przez odwrócenie jasnego.
# ---------------------------------------------------------------------------
kolory:
  surface:
    jasny: "#F5FAFC"   # bardzo jasny, lekko chłodny; białe są tylko kontenery grup
    ciemny: "#161B1D"  # ciemnoszare, nie czarne: mniej rażące przejścia przy jasnym tekście (Material, motyw ciemny)
    uzycie: nagłówek z polem wyszukiwania (V1), przypięty pasek czynności, pasek „Wstecz” po przewinięciu, tło pól tekstowych
    zrodlo: NFR-16, styl „Karta miejsca”
  surfaceContainerLowest:
    jasny: "#FFFFFF"   # białe kontenery na szarym arkuszu zastępują linie podziału
    ciemny: "#1E2427"
    uzycie: kontenery grup („Wejścia”, „Winda i toaleta”, „Piętra”, stan pusty barier), pływające kontrolki mapy, legenda, chipy
    zrodlo: NFR-16, styl „Karta miejsca”
  surfaceContainerLow:
    jasny: "#EFF4F6"
    ciemny: "#1A1F21"
    uzycie: pole wyszukiwania, pasek dolny nawigacji
    zrodlo: styl „Karta miejsca”
  surfaceContainer:
    jasny: "#E8EEF0"   # tło arkusza: o ton ciemniejsze niż kontenery grup, by grupy odcinały się bez ramek
    ciemny: "#0F1314"
    uzycie: tło arkusza z kartą budynku (V2) i arkusza na mapie (V1)
    zrodlo: styl „Karta miejsca”
  surfaceVariant:
    # W stylu „Karta miejsca” ten ton nazywa się surface-container-high.
    jasny: "#DCE2E4"
    ciemny: "#2A3033"
    uzycie: tło fragmentu mapy przed wczytaniem, ramka komunikatu i wskaźnika braku internetu
    zrodlo: NFR-16, styl „Karta miejsca”
  onSurface:
    jasny: "#161C1E"   # prawie czarny; ≥ 14:1 na każdym tle
    ciemny: "#E8EEF0"  # jasnoszary zamiast czystej bieli, by tekst nie „świecił” na ciemnym tle
    uzycie: tekst podstawowy, nazwa budynku, nagłówki grup, ikony i napisy uciążliwości oraz statusów zgłoszeń
    zrodlo: NFR-16, NFR-21
  onSurfaceVariant:
    jasny: "#3A4549"   # tekst drugorzędny wciąż ≥ 7:1, bo źródło i data oceny wejść są ważne (US17.3)
    ciemny: "#BCC9CD"
    uzycie: tekst drugorzędny (źródło i data, „Zalecane, parter”, podpisy), napisy i ikony paska dolnego
    zrodlo: NFR-16, US17.3
  outline:
    jasny: "#6A7579"   # ≥ 3:1 na każdym tle: ramka pola, chipu i przycisku obrysowanego wyznacza granicę celu dotyku
    ciemny: "#8A969A"
    uzycie: obramowanie pól (wyszukiwania i formularzy), ramek opcji, chipów, przycisków obrysowanych i segmentów
    zrodlo: NFR-16 (WCAG 1.4.11)
  primary:
    jasny: "#004E5E"   # ciemny morski: jedyny kolor akcentu
    ciemny: "#85D1EA"  # w ciemnym motywie jaśniejszy i mniej nasycony; nasycony kolor na ciemnym tle drga
    uzycie: symbol budynku, jedyny przycisk wypełniony na ekranie, przyciski tekstowe („Zgłoś problem”, „Pokaż na planie”), wskaźnik fokusu
    zrodlo: wymagania wspólne (czynność główna), NFR-16
  onPrimary:
    jasny: "#FFFFFF"
    ciemny: "#002933"  # ciemny morski na jasnym akcencie; biel dawałaby za mały kontrast
    uzycie: napis i ikona na przycisku wypełnionym, np. „Sprawdź, którędy wejść”
    zrodlo: NFR-16
  primaryContainer:
    jasny: "#C3E9F6"   # tylko to, co wybrane: osoba widzi, gdzie jest
    ciemny: "#0E4655"
    uzycie: wybrane piętro, wybrany widok i pozycja paska dolnego, plakietka budynku
    zrodlo: styl „Karta miejsca”
  onPrimaryContainer:
    jasny: "#001F27"
    ciemny: "#D3F2FC"
    uzycie: napis na wybranym elemencie i obwódka 2 dp wybranego piętra
    zrodlo: NFR-16
  secondaryContainer:
    jasny: "#D5E7ED"
    ciemny: "#2A434B"
    uzycie: przyciski tonalne, np. „Zgłoś barierę”, „Pokaż na mapie”
    zrodlo: styl „Karta miejsca”
  onSecondaryContainer:
    jasny: "#1C3640"
    ciemny: "#D3EEF7"
    uzycie: napis i ikona przycisku tonalnego
    zrodlo: NFR-16
  # Kontenery oznaczeń wejścia (decyzja 48 pkt 3). Znaczenie niesie kształt ikony i słowo;
  # ten sam kształt mają znaczniki wejść na mapie. Kształt rysuje kolor `on…Container`.
  statusDostepneContainer:
    # Kształt: koło ze znakiem ✓, słowo „Dostępne”.
    jasny: "#CDE8F0"   # spokojny morski
    ciemny: "#1C4350"
    uzycie: tło oznaczenia „Dostępne” przy wejściu i chipu „Wejście dostępne”
    zrodlo: NFR-21, US2.1, decyzja 48
  onStatusDostepneContainer:
    jasny: "#00313C"
    ciemny: "#D5F2FB"
    uzycie: słowo „Dostępne” i ikona koła ze znakiem ✓
    zrodlo: NFR-16, NFR-21
  statusNiedostepneContainer:
    # Kształt: ośmiokąt ze znakiem ✕, słowo „Niedostępne”.
    jasny: "#F2DFE4"   # przygaszony szaroróżowy, nie czerwony
    ciemny: "#4A2733"
    uzycie: tło oznaczenia „Niedostępne” przy wejściu
    zrodlo: NFR-21, US2.1, decyzja 48
  onStatusNiedostepneContainer:
    jasny: "#4A1B2A"
    ciemny: "#FFDDE6"
    uzycie: słowo „Niedostępne” i ikona ośmiokąta ze znakiem ✕
    zrodlo: NFR-16, NFR-21
  statusBrakDanychContainer:
    # Kształt: romb ze znakiem ?, słowo „Brak danych”.
    jasny: "#E3E5E6"   # neutralny szary
    ciemny: "#33393C"
    uzycie: tło oznaczenia „Brak danych” przy wejściu i w legendzie mapy
    zrodlo: NFR-21, US2.1, decyzja 48
  onStatusBrakDanychContainer:
    jasny: "#2A2E30"
    ciemny: "#E2E6E8"
    uzycie: słowo „Brak danych” i ikona rombu ze znakiem ?
    zrodlo: NFR-16, NFR-21
  error:
    # Ciemna czerwień tylko dla błędu walidacji: przy polu i w podsumowaniu nad formularzem
    # (C2, C6, C7, R2). Zawsze z pogrubionym tekstem, który mówi, co się stało i co zrobić
    # (wymagania wspólne fazy B). Błąd serwera, zapisu, logowania i brak internetu to zwykły
    # komunikat: onSurface na surfaceVariant, bez czerwieni. Styl „Karta miejsca” nie ma
    # formularzy, więc wartość zostaje z poprzedniej wersji pliku.
    jasny: "#8A0F18"
    ciemny: "#FFB3AE"  # jasny łososiowy; na ciemnym tle ≥ 7:1
    uzycie: tekst błędu walidacji przy polu i nad formularzem, obramowanie pola z błędem; nigdy dla oznaczenia wejścia, statusu ani uciążliwości
    zrodlo: NFR-15 (WCAG 3.3.1), NFR-21

# ---------------------------------------------------------------------------
# Kontrast — pary sprawdzane przez scripts/kontrast.py dla obu motywów,
# także po symulacji protanopii i deuteranopii.
# ---------------------------------------------------------------------------
kontrast:
  progi:
    # NFR-16 wymaga 4,5:1. Przyjmujemy 7:1 (WCAG 1.4.6, poziom AAA) dla każdego tekstu,
    # także dużego: PE-1 słabo czyta blady tekst w słońcu, PE-2 pracuje w słońcu,
    # PE-3 czyta drobny tekst z wysiłkiem. Skrypt odrzuca próg niższy niż w NFR-16.
    tekst: 7.0
    # NFR-16 i WCAG 1.4.11: ramki pól, ikony statusu, fokus, granica przycisku.
    komponent: 3.0
  pary:
    - {kolor: onSurface, tlo: surface, rodzaj: tekst, gdzie: "nagłówek V1, pasek czynności, pola"}
    - {kolor: onSurface, tlo: surfaceContainer, rodzaj: tekst, gdzie: "nazwa budynku i nagłówki grup na arkuszu"}
    - {kolor: onSurface, tlo: surfaceContainerLowest, rodzaj: tekst, gdzie: "treść w kontenerach grup, kontrolki mapy, legenda"}
    - {kolor: onSurface, tlo: surfaceContainerLow, rodzaj: tekst, gdzie: "pole wyszukiwania, pasek dolny"}
    - {kolor: onSurface, tlo: surfaceVariant, rodzaj: tekst, gdzie: "komunikat i wskaźnik braku internetu"}
    - {kolor: onSurfaceVariant, tlo: surfaceContainer, rodzaj: tekst, gdzie: "źródło i data na arkuszu"}
    - {kolor: onSurfaceVariant, tlo: surfaceContainerLowest, rodzaj: tekst, gdzie: "„Zalecane, parter”, podpis mapy"}
    - {kolor: onSurfaceVariant, tlo: surfaceContainerLow, rodzaj: tekst, gdzie: "podpowiedź w polu, napisy paska dolnego"}
    - {kolor: onSurfaceVariant, tlo: surfaceVariant, rodzaj: tekst, gdzie: "data przy wskaźniku braku internetu"}
    - {kolor: primary, tlo: surfaceContainer, rodzaj: tekst, gdzie: "symbol budynku na arkuszu"}
    - {kolor: primary, tlo: surfaceContainerLowest, rodzaj: tekst, gdzie: "przyciski tekstowe w kontenerach grup"}
    - {kolor: primary, tlo: surface, rodzaj: tekst, gdzie: "„Wstecz”, przycisk obrysowany"}
    - {kolor: onPrimary, tlo: primary, rodzaj: tekst, gdzie: "przycisk wypełniony"}
    - {kolor: onPrimaryContainer, tlo: primaryContainer, rodzaj: tekst, gdzie: "wybrane piętro, plakietka budynku"}
    - {kolor: onSecondaryContainer, tlo: secondaryContainer, rodzaj: tekst, gdzie: "przycisk tonalny"}
    - {kolor: onStatusDostepneContainer, tlo: statusDostepneContainer, rodzaj: tekst, gdzie: "„Dostępne” i koło ze znakiem ✓"}
    - {kolor: onStatusNiedostepneContainer, tlo: statusNiedostepneContainer, rodzaj: tekst, gdzie: "„Niedostępne” i ośmiokąt ze znakiem ✕"}
    - {kolor: onStatusBrakDanychContainer, tlo: statusBrakDanychContainer, rodzaj: tekst, gdzie: "„Brak danych” i romb ze znakiem ?"}
    - {kolor: error, tlo: surface, rodzaj: tekst, gdzie: "błąd przy polu"}
    - {kolor: error, tlo: surfaceContainerLowest, rodzaj: tekst, gdzie: "błąd przy polu w kontenerze grupy"}
    - {kolor: outline, tlo: surface, rodzaj: komponent, gdzie: "obramowanie pola i przycisku obrysowanego"}
    - {kolor: outline, tlo: surfaceContainer, rodzaj: komponent, gdzie: "obramowanie chipu na arkuszu"}
    - {kolor: outline, tlo: surfaceContainerLowest, rodzaj: komponent, gdzie: "obramowanie chipu w kontenerze"}
    - {kolor: outline, tlo: surfaceVariant, rodzaj: komponent, gdzie: "obramowanie ramki komunikatu"}
    - {kolor: primary, tlo: surface, rodzaj: komponent, gdzie: "granica przycisku wypełnionego, fokus"}

# ---------------------------------------------------------------------------
# Typografia — rozmiary w sp, żeby tekst rósł z ustawieniem czcionki (NFR-20, WCAG 1.4.4).
# Skala stylu „Karta miejsca”: symbol / nazwa / nagłówek grupy / pozycja / treść / podpis.
# Każdy styl interfejsu ma co najmniej 18 sp. Mniejsze (16 sp) są tylko napisy na mapie,
# zapisane w sekcji `mapa`.
# Interlinia tekstu podstawowego ≈ 1,45 rozmiaru (WCAG 1.4.8, poziom AAA, zaleca 1,5).
# ---------------------------------------------------------------------------
typografia:
  # Krój o wyraźnie różnych kształtach liter (I, l, 1; O, 0), zaprojektowany dla osób
  # słabowidzących. Licencja SIL Open Font License: aplikacja dołącza plik czcionki.
  # Gdy krój się nie wczyta, aplikacja używa kroju systemowego.
  kroj: Atkinson Hyperlegible Next
  # Żaden tekst w aplikacji nie jest mniejszy (próg zespołu, dotyczy też napisów mapy).
  # Skrypt sprawdza każdy styl.
  minimum_sp: 16
  # Pogrubienie przycisków, oznaczeń wejścia i błędu przy polu.
  wyroznienie_waga: 700
  style:
    displayLarge:
      sp: 57
      waga: 800
      interlinia_sp: 57   # symbol ma jeden krótki wiersz, np. „A-1”
      uzycie: symbol budynku na karcie, np. „A-1”
      zrodlo: styl „Karta miejsca”
    headlineMedium:
      sp: 28
      waga: 700
      interlinia_sp: 36
      uzycie: nazwa miejsca, np. „Gmach Główny”, „Sala 329”
      zrodlo: styl „Karta miejsca”, NFR-16 (duży tekst ≥ 24 sp)
    titleLarge:
      sp: 22
      waga: 600
      interlinia_sp: 28
      uzycie: nagłówek grupy, np. „Wejścia”, „Bariery w budynku”
      zrodlo: styl „Karta miejsca”, NFR-16 (duży tekst ≥ 19 sp pogrubiony)
    titleMedium:
      sp: 20
      waga: 700
      interlinia_sp: 26
      uzycie: nazwa wejścia, udogodnienia albo piętra w kontenerze grupy
      zrodlo: styl „Karta miejsca”, NFR-16 (duży tekst ≥ 19 sp pogrubiony)
    bodyLarge:
      sp: 18             # 34 znaki w wierszu na ekranie 360 dp (konwencja makiet)
      waga: 400
      interlinia_sp: 26
      uzycie: tekst podstawowy, np. „Drzwi 120 cm”, opis piętra, kroki do sali
      zrodlo: konwencje makiet, NFR-20, PE-1
    labelLarge:
      sp: 18
      waga: 600
      interlinia_sp: 24
      uzycie: napis przycisku i chipu; przyciski i oznaczenia wejścia mają wagę wyróżnienia
      zrodlo: styl „Karta miejsca”, NFR-17
    bodyMedium:
      sp: 18
      waga: 500
      interlinia_sp: 24
      uzycie: podpis, np. źródło i data oceny wejść, „Zalecane, parter”, podpis OpenStreetMap
      zrodlo: styl „Karta miejsca”, US17.3, NFR-37, NFR-40
    labelMedium:
      sp: 18
      waga: 500
      interlinia_sp: 20   # ciaśniej niż podpis, bo napis może mieć dwa wiersze pod ikoną
      uzycie: napisy pod ikonami paska dolnego, w razie potrzeby w dwóch wierszach
      zrodlo: styl „Karta miejsca”, wymagania wspólne (pasek dolny)

# ---------------------------------------------------------------------------
# Wymiary w dp. Odstępy na siatce 4 dp (Material 3); skrypt sprawdza wielokrotność.
# ---------------------------------------------------------------------------
siatka_dp: 4

odstepy:
  xs:
    dp: 4
    uzycie: odstęp ikony od napisu pod nią w pasku dolnym
    zrodlo: styl „Karta miejsca”
  s:
    dp: 8
    uzycie: odstęp między chipami i między ikoną a napisem w chipie
    zrodlo: styl „Karta miejsca”
  m:
    dp: 16             # 360 dp − 2 × 16 dp zostawia 328 dp na wiersz tekstu 18 sp
    uzycie: margines boczny ekranu, wcięcie treści w kontenerze grupy, odstęp pozycji w grupie
    zrodlo: konwencje makiet, styl „Karta miejsca”
  l:
    dp: 28             # odstęp nad nagłówkiem grupy, np. „Wejścia”, „Piętra”
    uzycie: odstęp między grupami arkusza
    zrodlo: styl „Karta miejsca”

cele_dotyku:
  minimum:
    dp: 48
    uzycie: najmniejszy cel dotyku, np. przycisk tekstowy „Zgłoś problem”, chip, kontrolka mapy, piętro w przełączniku
    zrodlo: NFR-17
  przycisk:
    dp: 56             # zapas ponad 48 dp: PE-1 ma lekkie drżenie dłoni i chybia małe przyciski
    uzycie: najmniejsza wysokość przycisku wypełnionego, tonalnego i obrysowanego; przy dużej czcionce rośnie razem z tekstem
    zrodlo: NFR-17, NFR-20, PE-1
  przypiety:
    dp: 60
    uzycie: wysokość przycisków przypiętych nad paskiem dolnym, np. „Sprawdź, którędy wejść” i „Pokaż na mapie” (V2)
    zrodlo: styl „Karta miejsca”, NFR-17
  odstep:
    dp: 8
    uzycie: najmniejszy odstęp między dwoma osobnymi celami dotyku, np. chipami
    zrodlo: wytyczne Material dla celów dotyku

obramowania:
  ramka:
    dp: 1              # granicę wyznacza kolor `outline` (≥ 3:1), a nie grubość
    uzycie: obramowanie pola wyszukiwania, chipów, przycisków obrysowanych i segmentów
    zrodlo: styl „Karta miejsca”, NFR-16 (WCAG 1.4.11)
  wybrane:
    dp: 2
    uzycie: obwódka wybranego piętra w przełączniku, w kolorze `onPrimaryContainer`
    zrodlo: styl „Karta miejsca”, NFR-21
  fokus:
    dp: 3
    uzycie: wskaźnik fokusu klawiatury, w kolorze `primary`, 2 dp od elementu; ramkę fokusu TalkBack rysuje system
    zrodlo: NFR-15 (WCAG 2.4.7), NFR-16

zaokraglenia:
  standard:
    dp: 8
    uzycie: oznaczenie wejścia, chipy, podpis OpenStreetMap na mapie
    zrodlo: styl „Karta miejsca” (Material 3, kształt mały)
  srednie:
    dp: 12
    uzycie: plakietka budynku na liście, tło piktogramu udogodnienia
    zrodlo: styl „Karta miejsca” (Material 3, kształt średni)
  duze:
    dp: 16
    uzycie: kontenery grup, legenda, kroki do sali, plakietka „A-1” na arkuszu
    zrodlo: styl „Karta miejsca” (Material 3, kształt duży)
  kapsula:
    dp: 24             # połowa celu 48 dp: kontrolka ma kształt kapsuły
    uzycie: kontrolki 48 dp, np. „Wstecz” na mapie, przyciski +/−, piętra w przełączniku, segmenty, małe przyciski
    zrodlo: styl „Karta miejsca”
  bardzo_duze:
    dp: 28             # połowa przycisku 56 dp
    uzycie: przyciski 56 dp i przypięte, pole wyszukiwania, przełącznik pięter, górne rogi arkusza
    zrodlo: styl „Karta miejsca” (Material 3, kształt bardzo duży)

ikony:
  rozmiar:
    dp: 24             # ikona oznaczenia wejścia i chipu rośnie z tekstem: 1,33 wysokości napisu
    uzycie: ikona oznaczenia wejścia, chipu, przycisku i paska dolnego, zawsze z napisem obok
    zrodlo: NFR-21, słownik użytkownika (Metafory i ikony)

# ---------------------------------------------------------------------------
# Wysokości (cień) w dp, poziomy Material 3. Skrypt strony jeszcze ich nie sprawdza.
# Cień w stylu „Karta miejsca”: kontrolki 0 1 2 + 0 3 8 px, pasek czynności 0 −4 12 px.
# W ciemnym motywie cień słabo widać, więc element pływający ma dodatkowo obwódkę 1 dp.
# ---------------------------------------------------------------------------
wysokosci:
  kontrolki_mapy:
    dp: 3              # Material 3, poziom 2
    obwodka_ciemny: "#4A5558"
    uzycie: pływające kontrolki mapy (+/−, położenie, przełącznik pięter, legenda, „Wstecz”), nagłówek z polem wyszukiwania (V1)
    zrodlo: styl „Karta miejsca”
  pasek_czynnosci:
    dp: 6              # Material 3, poziom 3; cień pada w górę
    uzycie: przypięty pasek czynności nad paskiem dolnym (V2), arkusz na mapie (V1)
    zrodlo: styl „Karta miejsca”

# ---------------------------------------------------------------------------
# Paleta mapy: podkład, budynki PWr, plan piętra (styl mapy wektorowej, decyzja 44).
# Nie są to role Material 3: aplikacja wstawia je do stylu mapy, a nie do motywu.
# Ta sama barwa morska co `primary`. Napisy mapy: Noto Sans 16 sp z obwódką.
# Skrypt strony jeszcze nie sprawdza tej sekcji; pary niżej mają ten sam zapis
# co `kontrast.pary`, a progi są te same (tekst 7:1, nietekst 3:1).
# ---------------------------------------------------------------------------
mapa:
  napisy_sp: 16
  kolory:
    lad: {jasny: "#E8EDEE", ciemny: "#141819", uzycie: tło lądu}
    zielen: {jasny: "#D4DFD5", ciemny: "#1A241E", uzycie: parki i trawniki}
    woda: {jasny: "#BFD0D8", ciemny: "#0F2129", uzycie: rzeka i kanały}
    droga: {jasny: "#FFFFFF", ciemny: "#2C3335", uzycie: wypełnienie ulic}
    droga_kontur: {jasny: "#C5CDD0", ciemny: "#1F2527", uzycie: obrzeże ulic}
    tory: {jasny: "#A3ACAF", ciemny: "#4C565A", uzycie: tory}
    chodnik: {jasny: "#F7F9FA", ciemny: "#252B2D", uzycie: chodniki i place}
    budynek: {jasny: "#D6DBDD", ciemny: "#22282A", uzycie: budynki spoza PWr}
    budynek_kontur: {jasny: "#C2C9CC", ciemny: "#30373A", uzycie: kontur budynków spoza PWr}
    pwr: {jasny: "#BFE0EC", ciemny: "#17363F", uzycie: wypełnienie budynków PWr}
    pwr_kontur: {jasny: "#004E5E", ciemny: "#85D1EA", uzycie: kontur budynków PWr (= primary)}
    napis_pwr: {jasny: "#00303B", ciemny: "#DAF5FF", uzycie: "symbol budynku, „Sala 329”, „Winda”, „Toaleta”"}
    napis_ulica: {jasny: "#3A4549", ciemny: "#BCC9CD", uzycie: nazwy ulic i numery sal}
    napis_woda: {jasny: "#2B454D", ciemny: "#BCD9E3", uzycie: nazwa rzeki}
    obwodka: {jasny: "#FFFFFF", ciemny: "#101415", uzycie: obwódka napisów}
    sciezka: {jasny: "#004E5E", ciemny: "#85D1EA", uzycie: ścieżka dostosowana}
    tusz: {jasny: "#181C1D", ciemny: "#EAEFF1", uzycie: "znaczniki wejść, ikony pochylni i planu"}
    papier: {jasny: "#FFFFFF", ciemny: "#101415", uzycie: wnętrze znaczników}
    p_korytarz: {jasny: "#FFFFFF", ciemny: "#272D2F", uzycie: korytarz na planie piętra}
    p_sala: {jasny: "#D2EAF3", ciemny: "#183A45", uzycie: sala na planie piętra}
    p_inne: {jasny: "#E1E6E8", ciemny: "#1C2123", uzycie: inne pomieszczenia i klatki schodowe}
    p_winda: {jasny: "#A7C0C9", ciemny: "#3D5A64", uzycie: winda}
    p_wzor: {jasny: "#4A5559", ciemny: "#9EAAAE", uzycie: kreskowanie klatek schodowych i kropki toalet}
    p_wc: {jasny: "#F2F5F6", ciemny: "#22282A", uzycie: toaleta}
    p_kontur: {jasny: "#6A7579", ciemny: "#879397", uzycie: ściany na planie piętra}
    p_wybrana: {jasny: "#8FD3EA", ciemny: "#2B6D82", uzycie: szukana sala}
    p_wybrana_kontur: {jasny: "#001F27", ciemny: "#DAF5FF", uzycie: kontur szukanej sali}
  pary:
    - {kolor: napis_pwr, tlo: obwodka, rodzaj: tekst, gdzie: "symbol budynku, nazwy na planie"}
    - {kolor: napis_ulica, tlo: obwodka, rodzaj: tekst, gdzie: "nazwy ulic, numery sal"}
    - {kolor: napis_woda, tlo: obwodka, rodzaj: tekst, gdzie: nazwa rzeki}
    - {kolor: pwr_kontur, tlo: lad, rodzaj: komponent, gdzie: kontur budynku PWr na podkładzie}
    - {kolor: pwr_kontur, tlo: pwr, rodzaj: komponent, gdzie: kontur budynku PWr do wypełnienia}
    - {kolor: pwr_kontur, tlo: budynek, rodzaj: komponent, gdzie: kontur PWr przy budynku spoza PWr}
    - {kolor: sciezka, tlo: lad, rodzaj: komponent, gdzie: ścieżka dostosowana na podkładzie}
    - {kolor: sciezka, tlo: droga, rodzaj: komponent, gdzie: ścieżka dostosowana na ulicy}
    - {kolor: tusz, tlo: lad, rodzaj: komponent, gdzie: "znacznik wejścia, ikona pochylni"}
    - {kolor: tusz, tlo: pwr, rodzaj: komponent, gdzie: znacznik wejścia na budynku PWr}
    - {kolor: papier, tlo: tusz, rodzaj: komponent, gdzie: znak wewnątrz znacznika}
    - {kolor: tusz, tlo: p_korytarz, rodzaj: komponent, gdzie: ikona planu na korytarzu}
    - {kolor: tusz, tlo: p_winda, rodzaj: komponent, gdzie: ikona windy}
    - {kolor: p_kontur, tlo: p_sala, rodzaj: komponent, gdzie: ściany sali}
    - {kolor: p_kontur, tlo: p_korytarz, rodzaj: komponent, gdzie: ściany korytarza}
    - {kolor: p_kontur, tlo: p_inne, rodzaj: komponent, gdzie: ściany innych pomieszczeń}
    - {kolor: p_wzor, tlo: p_inne, rodzaj: komponent, gdzie: kreskowanie klatek schodowych}
    - {kolor: p_wzor, tlo: p_wc, rodzaj: komponent, gdzie: kropki toalet}
    - {kolor: p_wybrana_kontur, tlo: p_wybrana, rodzaj: komponent, gdzie: kontur szukanej sali do wypełnienia}
    - {kolor: p_wybrana_kontur, tlo: p_korytarz, rodzaj: komponent, gdzie: kontur szukanej sali do korytarza}
    - {kolor: p_wybrana_kontur, tlo: p_sala, rodzaj: komponent, gdzie: kontur szukanej sali do sąsiedniej sali}
