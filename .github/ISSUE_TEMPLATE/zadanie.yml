name: Zadanie
description: Jedna mała, niezależna zmiana (jedno zadanie = jeden PR).
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Co jest nie tak albo czego brakuje, wraz z dowodem (link do wiersza kodu, przebieg CI, wynik polecenia).
    validations:
      required: true
  - type: textarea
    id: oczekiwane
    attributes:
      label: Oczekiwane
      description: Jak ma działać po zmianie; odwołanie do US, AC, BR lub NFR, jeśli dotyczy.
      placeholder: "US-1.1, AC-1: ..."
    validations:
      required: true
  - type: textarea
    id: gotowe-gdy
    attributes:
      label: Gotowe, gdy
      description: Sprawdzalne warunki zakończenia, po jednym w wierszu, oraz polecenie sprawdzenia.
      placeholder: "- [ ] ..."
    validations:
      required: true
