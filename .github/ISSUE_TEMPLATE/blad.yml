name: Błąd
description: Zachowanie niezgodne z wymaganiem.
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Co się dzieje, wraz z dowodem (komunikat błędu, link do wiersza kodu, przebieg CI, zrzut ekranu).
    validations:
      required: true
  - type: textarea
    id: jak-odtworzyc
    attributes:
      label: Jak odtworzyć
      description: Numerowane kroki; wersja aplikacji lub gałąź, urządzenie, rola użytkownika.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: oczekiwane
    attributes:
      label: Oczekiwane
      description: Jak ma działać zgodnie z wymaganiem (US, AC, BR, NFR) lub dokumentem opisującym zachowanie.
      placeholder: "US-1.1, AC-1: ..."
    validations:
      required: true
  - type: textarea
    id: gotowe-gdy
    attributes:
      label: Gotowe, gdy
      description: Sprawdzalne warunki zakończenia; test, który pada przed poprawką.
      placeholder: "- [ ] ..."
    validations:
      required: true
