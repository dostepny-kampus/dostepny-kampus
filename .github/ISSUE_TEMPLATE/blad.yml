name: Błąd
description: Zachowanie niezgodne z wymaganiem.
labels:
  - bug
body:
  - type: textarea
    id: wymaganie
    attributes:
      label: Wymaganie
      description: Którego wymagania dotyczy błąd (US, AC, BR, NFR) albo jaki dokument opisuje oczekiwane zachowanie.
      placeholder: "US-1.1, AC-1: ..."
    validations:
      required: true
  - type: textarea
    id: kroki
    attributes:
      label: Kroki do odtworzenia
      description: Numerowane kroki; wersja aplikacji lub gałąź, urządzenie, rola użytkownika.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: oczekiwane
    attributes:
      label: Oczekiwany wynik
    validations:
      required: true
  - type: textarea
    id: rzeczywiste
    attributes:
      label: Rzeczywisty wynik
      description: Co się dzieje; komunikat błędu lub zrzut ekranu, jeśli jest.
    validations:
      required: true
