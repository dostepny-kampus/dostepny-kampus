      - checks_requested

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  # Nowszy przebieg anuluje starszy także dla push i merge_group: wynik na głowie gałęzi ma być zawsze dostępny, a bez tego
  # przy serii scaleń kolejne pushe czekały w grupie i były zastępowane, więc żaden nie kończył się i nie zapisywał cache.
  cancel-in-progress: true

jobs:
  porownanie:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/drzewo-grupy.yml
    with:
      workflow: android.yml

  zmiany:
    # Także dla grupy kolejki: bez tego każda grupa budowała aplikację i uruchamiała emulatory, choć PR nie zmieniał Androida.
    # Na push zadanie jest pominięte, więc pozostałe idą zawsze; gdy się nie powiedzie, check `budowanie` jest czerwony.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.diff.outputs.android }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Sprawdź, czy PR albo grupa w kolejce zmienia aplikację Android, jej dane albo tokeny
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
