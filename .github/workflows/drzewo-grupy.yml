name: drzewo-grupy

# Job `porownanie` (android, pr-guard): zapisuje drzewo scalenia na PR, w grupie kolejki je porównuje (pomin).
on:
  workflow_call:
    inputs:
      workflow:
        required: true
        type: string
    outputs:
      pomin:
        value: ${{ jobs.drzewo.outputs.pomin }}

permissions:
  actions: read
  contents: read

jobs:
  drzewo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pomin: ${{ steps.porownanie.outputs.pomin }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Tylko skrypty i akcja, nie pozostały kod PR.
          sparse-checkout: |
            .github/scripts
            .github/actions/drzewo-grupy
          persist-credentials: false
      - id: porownanie
        uses: ./.github/actions/drzewo-grupy
        with:
          workflow: ${{ inputs.workflow }}
