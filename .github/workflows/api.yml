name: api

on:
  pull_request:
    branches:
      - main
      - "sprint/**"
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OASDIFF_VERSION: 1.34.1
  OASDIFF_SHA256: 75775f65b0adebd26a8e013af51a799342dfdc6262d89efa9e3b7bdf89657d90

jobs:
  zmiany:
    # Nieudane `zmiany` uruchamia kontrole w pełni. Równe drzewo grupy (pomin) je pomija.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pomin: ${{ steps.drzewo.outputs.pomin }}
      api: ${{ steps.diff.outputs.api }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: drzewo
        uses: ./.github/actions/drzewo-grupy
        with:
          workflow: api.yml
      - name: Sprawdź, czy PR albo grupa w kolejce zmienia kontrakt API
        id: diff
        if: steps.drzewo.outputs.pomin != 'true'
        run: >-
          .github/scripts/zmiany-obszaru.sh api api .github/workflows/api.yml .github/scripts/zmiany-obszaru.sh

  kontrakt:
    needs: zmiany
    if: ${{ !cancelled() && needs.zmiany.outputs.pomin != 'true' && (needs.zmiany.result != 'success' || needs.zmiany.outputs.api == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Zainstaluj Redocly z pliku lock
        working-directory: api
        run: npm ci --no-audit --no-fund
      - name: Sprawdź kontrakt regułami Redocly
        working-directory: api
        run: npx --no-install redocly lint --format=github-actions openapi.yaml

  zmiany-lamiace:
    needs: zmiany
    if: ${{ !cancelled() && needs.zmiany.outputs.pomin != 'true' && (needs.zmiany.result != 'success' || needs.zmiany.outputs.api == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pobierz oasdiff
        working-directory: ${{ runner.temp }}
        run: |
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}"
          curl -sSfLO "${url}/${archive}"
          echo "${OASDIFF_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" oasdiff
      - name: Porównaj kontrakt z gałęzią bazową
        run: |
          if ! git cat-file -e "${BASE_SHA}:api/openapi.yaml" 2>/dev/null; then
            echo "::notice title=oasdiff::Gałąź bazowa nie ma api/openapi.yaml, porównanie pominięte."
            exit 0
          fi
          git show "${BASE_SHA}:api/openapi.yaml" > "${RUNNER_TEMP}/base.yaml"
          set -o pipefail
          "${RUNNER_TEMP}/oasdiff" breaking "${RUNNER_TEMP}/base.yaml" api/openapi.yaml \
            --format githubactions | sed 's/^::error /::warning /'
