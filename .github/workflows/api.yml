name: api

on:
  pull_request:
    branches:
      - main
      - "sprint/**"
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REDOCLY_VERSION: 2.71.2
  OASDIFF_VERSION: 1.34.1
  OASDIFF_SHA256: 75775f65b0adebd26a8e013af51a799342dfdc6262d89efa9e3b7bdf89657d90

jobs:
  porownanie:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/drzewo-grupy.yml
    with:
      workflow: api.yml

  zmiany:
    needs: porownanie
    # Nieudane `zmiany` uruchamia kontrakt i zmiany-lamiace. Równe drzewo grupy dalej je pomija.
    if: ${{ !cancelled() && needs.porownanie.outputs.pomin != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.diff.outputs.api }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Sprawdź, czy PR albo grupa w kolejce zmienia kontrakt API
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          from=HEAD^1
          to=HEAD
          if [[ $EVENT == merge_group ]]; then
            git fetch --no-tags --depth=1 origin "$GROUP_BASE_SHA"
            from=$GROUP_BASE_SHA
            to=$GROUP_HEAD_SHA
          fi
          if git diff --quiet "$from" "$to" -- api .github/workflows/api.yml; then
            echo "api=false" >> "$GITHUB_OUTPUT"
          else
            echo "api=true" >> "$GITHUB_OUTPUT"
          fi

  kontrakt:
    needs: [porownanie, zmiany]
    if: ${{ !cancelled() && needs.porownanie.outputs.pomin != 'true' && (needs.zmiany.result != 'success' || needs.zmiany.outputs.api == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Sprawdź kontrakt regułami Redocly
        working-directory: api
        run: npx --yes "@redocly/cli@${REDOCLY_VERSION}" lint --format=github-actions openapi.yaml

  zmiany-lamiace:
    needs: [porownanie, zmiany]
    if: ${{ !cancelled() && needs.porownanie.outputs.pomin != 'true' && (needs.zmiany.result != 'success' || needs.zmiany.outputs.api == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pobierz oasdiff
        working-directory: ${{ runner.temp }}
        run: |
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}"
          curl -sSfLO "${url}/${archive}"
          echo "${OASDIFF_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" oasdiff
      - name: Porównaj kontrakt z gałęzią bazową
        run: |
          if ! git cat-file -e "${BASE_SHA}:api/openapi.yaml" 2>/dev/null; then
            echo "::notice title=oasdiff::Gałąź bazowa nie ma api/openapi.yaml, porównanie pominięte."
            exit 0
          fi
          git show "${BASE_SHA}:api/openapi.yaml" > "${RUNNER_TEMP}/base.yaml"
          set -o pipefail
          "${RUNNER_TEMP}/oasdiff" breaking "${RUNNER_TEMP}/base.yaml" api/openapi.yaml \
            --format githubactions | sed 's/^::error /::warning /'
