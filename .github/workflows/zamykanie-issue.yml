name: zamykanie-issue

# GitHub zamyka issue z „Closes #N” tylko po scaleniu PR do gałęzi domyślnej, więc po scaleniu PR do `sprint/*`
# zamykamy je tu. Skrypt pochodzi z gałęzi docelowej (po scaleniu), nie z kodu PR; PR z forków mają token tylko
# do odczytu, więc je pomijamy.
on:
  pull_request:
    branches:
      - "sprint/**"
    types:
      - closed

permissions:
  contents: read

jobs:
  zamknij:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - name: Zamknij issue wskazane w opisie scalonego PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/zamknij-issue.sh "$PR_NUMBER"
