name: docs

on:
  pull_request:
    branches:
      - main
      - "sprint/**"
  push:
    branches:
      - main
      - "sprint/**"
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"
  JAVA_VERSION: "25"
  VALE_VERSION: 3.25.1
  VALE_SHA256: 4bf5c5176b682b1da0830f471584d3494f1c2e27ee3029e1ad6f6661d4962182
  PLANTUML_VERSION: 1.2026.9
  PLANTUML_SHA256: aa4a1d06f8911c4b842beff4828dd955be431692b631a312d04c0e9fab9581de
  NO_MKDOCS_2_WARNING: "1"

jobs:
  porownanie:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/drzewo-grupy.yml
    with:
      workflow: docs.yml

  zmiany:
    needs: porownanie
    # Nieudane `zmiany` uruchamia kontrolę. Równe drzewo grupy dalej ją pomija.
    if: ${{ !cancelled() && needs.porownanie.outputs.pomin != 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dokumentacja: ${{ steps.diff.outputs.dokumentacja }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Sprawdź, czy PR albo grupa w kolejce zmienia dokumentację, scenariusze, testy Androida albo zestawy scenariuszy serwera
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          from=HEAD^1
          to=HEAD
          if [[ $EVENT == merge_group ]]; then
            git fetch --no-tags --depth=1 origin "$GROUP_BASE_SHA"
            from=$GROUP_BASE_SHA
            to=$GROUP_HEAD_SHA
          fi
          android_tests=(':(glob)android/**/src/test*/**' ':(glob)android/**/src/*Test*/**')
          if git diff --quiet "$from" "$to" -- docs specs .github/workflows/docs.yml backend/src/test/java "${android_tests[@]}"; then
            echo "dokumentacja=false" >> "$GITHUB_OUTPUT"
          else
            echo "dokumentacja=true" >> "$GITHUB_OUTPUT"
          fi

  kontrola:
    needs: [porownanie, zmiany]
    if: ${{ !cancelled() && needs.porownanie.outputs.pomin != 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && (needs.zmiany.result != 'success' || needs.zmiany.outputs.dokumentacja == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: docs
    env:
      DK_NODE_MODULES: ${{ github.workspace }}/docs/node_modules
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # PR i kolejka tylko odtwarzają wpisy gałęzi sprintu; zapisuje je zadanie pamiec po pushu.
      - name: Przywróć pakiety pip z pamięci podręcznej
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-docs-${{ hashFiles('docs/requirements.txt') }}
      - name: Przywróć pakiety npm z pamięci podręcznej
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.npm
          key: npm-docs-${{ hashFiles('docs/package-lock.json') }}
      - name: Przywróć serwer LanguageTool z pamięci podręcznej
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/language_tool_python
          key: languagetool-Linux-${{ hashFiles('docs/requirements.txt') }}
      - name: Zainstaluj zależności Pythona
        run: python -m pip install -r requirements.txt
      - name: Zainstaluj zależności Node
        run: npm ci --no-audit --no-fund
      - name: Pobierz Vale i PlantUML
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p narzedzia
          cd narzedzia
          vale_archive="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl -sSfLO "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/${vale_archive}"
          echo "${VALE_SHA256}  ${vale_archive}" | sha256sum --check --strict
          tar -xzf "${vale_archive}" vale
          plantuml_jar="plantuml-${PLANTUML_VERSION}.jar"
          curl -sSfLO "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/${plantuml_jar}"
          echo "${PLANTUML_SHA256}  ${plantuml_jar}" | sha256sum --check --strict
          mv "${plantuml_jar}" plantuml.jar
      - name: Testy skryptów dokumentacji
        run: python -X utf8 -m unittest discover -s scripts/tests -v
      - name: Uruchom verify.py
        id: verify
        env:
          VALE_BIN: ${{ runner.temp }}/narzedzia/vale
          PLANTUML_JAR: ${{ runner.temp }}/narzedzia/plantuml.jar
          BAZA_POKRYCIA: HEAD^1
        run: |
          mapfile -t changed < <(git diff --name-only --relative --diff-filter=d HEAD^1 HEAD -- 'docs/*.md')
          python -X utf8 scripts/verify.py "${changed[@]}"
      - name: Zezwól Chromium na piaskownicę przestrzeni nazw
        if: ${{ !cancelled() && steps.verify.outcome != 'skipped' }}
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Wyrenderuj wszystkie diagramy do katalogu tymczasowego
        if: ${{ !cancelled() && steps.verify.outcome != 'skipped' }}
        env:
          PLANTUML_JAR: ${{ runner.temp }}/narzedzia/plantuml.jar
        run: python -X utf8 scripts/render.py --force --out "${RUNNER_TEMP}/diagramy"

  # Jedna publikacja zawiera dwie wersje: main w katalogu głównym i najwyższy sprint/N pod /sprint/.
  pamiec:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/sprint/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: pip
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-docs-${{ hashFiles('docs/requirements.txt') }}
          lookup-only: true
      - id: npm
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.npm
          key: npm-docs-${{ hashFiles('docs/package-lock.json') }}
          lookup-only: true
      - id: lt
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/language_tool_python
          key: languagetool-Linux-${{ hashFiles('docs/requirements.txt') }}
          lookup-only: true
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Pobierz pakiety pip
        if: steps.pip.outputs.cache-hit != 'true' || steps.lt.outputs.cache-hit != 'true'
        run: python -m pip install -r requirements.txt
      - name: Pobierz pakiety npm
        if: steps.npm.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - name: Pobierz serwer LanguageTool
        if: steps.lt.outputs.cache-hit != 'true'
        run: python -c "import language_tool_python; language_tool_python.LanguageTool('pl-PL').close()"
      - if: steps.pip.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-docs-${{ hashFiles('docs/requirements.txt') }}
      - if: steps.npm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.npm
          key: npm-docs-${{ hashFiles('docs/package-lock.json') }}
      - if: steps.lt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/language_tool_python
          key: languagetool-Linux-${{ hashFiles('docs/requirements.txt') }}

  strona:
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/sprint/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Wspólna grupa dla main i sprintów: publikacje idą po kolei, a czekająca zastępuje starszą czekającą.
    concurrency:
      group: docs-strona
      cancel-in-progress: false
    steps:
      - name: Ustal bieżący sprint
        id: sprint
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          galaz="$(git ls-remote --heads "$REPO_URL" 'refs/heads/sprint/*' | sed 's|.*refs/heads/||' | sort -V | tail -n 1)"
          if [[ -z "$galaz" ]]; then
            echo "::error title=Strona sprintu::brak gałęzi sprint/N w repozytorium."
            exit 1
          fi
          echo "Bieżący sprint: ${galaz}"
          echo "galaz=${galaz}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          path: main
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.sprint.outputs.galaz }}
          path: sprint
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Zbuduj stronę z main i z bieżącego sprintu
        env:
          STRONA: ${{ runner.temp }}/strona
        # Każde drzewo ma własne środowisko, bo main i sprint mogą mieć różne wersje zależności.
        # Najpierw main: mkdocs czyści katalog docelowy, więc sprint trafia do podkatalogu po nim.
        run: |
          zbuduj() {
            local drzewo="$1" konfiguracja="$2" cel="$3" python="${RUNNER_TEMP}/venv-$1/bin/python"
            python -m venv "${RUNNER_TEMP}/venv-${drzewo}"
            "$python" -m pip install -r "${drzewo}/docs/requirements.txt"
            (
              cd "${drzewo}/docs"
              "$python" -X utf8 scripts/abbr.py
              "$python" -m mkdocs build --strict -f "$konfiguracja" --site-dir "$cel"
            )
          }
          zbuduj main mkdocs.yml "$STRONA"
          zbuduj sprint mkdocs-sprint.yml "${STRONA}/sprint"
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ runner.temp }}/strona

  publikacja:
    needs: strona
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: docs-publikacja
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
