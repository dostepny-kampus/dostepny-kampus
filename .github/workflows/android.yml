name: android

on:
  pull_request:
    branches:
      - main
      - "sprint/**"
  push:
    branches:
      - main
      - "sprint/**"
    paths:
      - "android/**"
      - "data/buildings/**"
      - "docs/docs/ux/tokeny.yml"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zmiany:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.diff.outputs.android }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Sprawdź, czy PR zmienia aplikację Android, jej dane albo tokeny
        id: diff
        run: |
          if git diff --quiet HEAD^1 HEAD -- android data/buildings docs/docs/ux/tokeny.yml .github/workflows/android.yml; then
            echo "android=false" >> "$GITHUB_OUTPUT"
          else
            echo "android=true" >> "$GITHUB_OUTPUT"
          fi

  budowanie:
    needs: zmiany
    if: ${{ !cancelled() && (needs.zmiany.result != 'success' || needs.zmiany.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - name: Odtwórz pobrane zależności i dystrybucje Gradle
        id: zaleznosci
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: >-
            android-zaleznosci-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('android/**/*.gradle.kts', 'android/**/gradle.properties', 'android/**/*.toml', 'android/**/gradle.lockfile', 'android/gradle/verification-metadata.xml', 'android/gradle/wrapper/gradle-wrapper.properties', '.github/workflows/android.yml') }}
          restore-keys: |
            android-zaleznosci-v1-${{ runner.os }}-${{ runner.arch }}-
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: external
      - name: Zbuduj i sprawdź
        run: ./gradlew check assembleDebug
      - name: Zapisz raporty lint i detekt
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: raporty-android
          path: android/**/build/reports/
          if-no-files-found: ignore
      - name: Zapisz pobrane zależności i dystrybucje Gradle
        if: >-
          ${{ success() && github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/sprint/')) &&
            steps.zaleznosci.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ steps.zaleznosci.outputs.cache-primary-key }}
