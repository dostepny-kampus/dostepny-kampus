name: android

on:
  pull_request:
    branches:
      - main
      - "sprint/**"
  push:
    branches:
      - main
      - "sprint/**"
    paths:
      - "android/**"
      - "data/buildings/**"
      - "api/openapi.yaml"
      - "docs/docs/ux/tokeny.yml"
      - ".github/workflows/android.yml"
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zmiany:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.diff.outputs.android }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Sprawdź, czy PR zmienia aplikację Android, jej dane albo tokeny
        id: diff
        run: |
          if git diff --quiet HEAD^1 HEAD -- android data/buildings api/openapi.yaml docs/docs/ux/tokeny.yml .github/workflows/android.yml; then
            echo "android=false" >> "$GITHUB_OUTPUT"
          else
            echo "android=true" >> "$GITHUB_OUTPUT"
          fi

  budowanie:
    needs: zmiany
    if: ${{ !cancelled() && (needs.zmiany.result != 'success' || needs.zmiany.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 25
      - name: Odtwórz pobrane zależności i dystrybucje Gradle
        id: zaleznosci
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: >-
            android-zaleznosci-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('android/**/*.gradle.kts', 'android/**/gradle.properties', 'android/**/*.toml', 'android/**/gradle.lockfile', 'android/gradle/verification-metadata.xml', 'android/gradle/wrapper/gradle-wrapper.properties', '.github/workflows/android.yml') }}
          restore-keys: |
            android-zaleznosci-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Odtwórz cache budowania Gradle
        id: cache-budowania
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: android-budowanie-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            android-budowanie-v1-${{ runner.os }}-${{ runner.arch }}-
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-provider: external
      - name: Zbuduj i sprawdź
        run: ./gradlew check assembleDebug
      - name: Zapisz raporty lint i detekt
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: raporty-android
          path: android/**/build/reports/
          if-no-files-found: ignore
      - name: Zapisz pobrane zależności i dystrybucje Gradle
        if: >-
          ${{ success() && github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/sprint/')) &&
            steps.zaleznosci.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ steps.zaleznosci.outputs.cache-primary-key }}
      - name: Zapisz cache budowania Gradle
        if: >-
          ${{ success() && github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/sprint/')) &&
            steps.cache-budowania.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ steps.cache-budowania.outputs.cache-primary-key }}

  emulator:
    needs: apk
    if: ${{ !cancelled() && needs.apk.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Wersja minimalna i docelowa z NFR-41.
        api: [26, 36]
    env:
      IMAGE: system-images;android-${{ matrix.api }};default;x86_64
    steps:
      - name: Pobierz APK aplikacji i testów
        uses: actions/download-artifact@v8.0.2
        with:
          name: apk-debug
          path: ${{ runner.temp }}/apk
      - name: Włącz KVM dla emulatora
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Uruchom emulator API ${{ matrix.api }}
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/avd
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          (yes || true) | "$sdk/sdkmanager" --licenses > /dev/null
          "$sdk/sdkmanager" emulator platform-tools "$IMAGE" > /dev/null
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$sdk/avdmanager" create avd --force -n kampus -k "$IMAGE"
          "$ANDROID_HOME/emulator/emulator" -accel-check
          nohup "$ANDROID_HOME/emulator/emulator" -avd kampus -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect -camera-back none > "$RUNNER_TEMP/emulator.log" 2>&1 &
          if ! timeout 600 bash -c 'adb wait-for-device && until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 5; done'; then
            echo "::error title=Emulator::Emulator API ${{ matrix.api }} nie uruchomił się w 10 minut."
            cat "$RUNNER_TEMP/emulator.log"
            exit 1
          fi
          for scale in window_animation_scale transition_animation_scale animator_duration_scale; do
            adb shell settings put global "$scale" 0
          done
      - name: Zainstaluj APK aplikacji i testów
        run: |
          # Artefakt zachowuje strukturę katalogów od najbliższego wspólnego przodka, więc pliki szukamy po nazwie.
          find "$RUNNER_TEMP/apk" -name '*.apk' -print
          adb install -r -t "$(find "$RUNNER_TEMP/apk" -name app-debug.apk | head -n 1)"
          adb install -r -t "$(find "$RUNNER_TEMP/apk" -name app-debug-androidTest.apk | head -n 1)"
      - name: Testy na emulatorze
        run: |
          # Uruchamiacz testów (np. własny runner Hilt) odczytujemy z zainstalowanego APK testów, nie z konfiguracji workflow.
          uruchamiacz="$(adb shell pm list instrumentation | tr -d '\r' | sed -n 's/^instrumentation:\([^ ]*\) (target=io.github.dostepnykampus)$/\1/p' | head -n 1)"
          if [[ -z $uruchamiacz ]]; then
            echo "::error title=Testy na emulatorze::Nie znaleziono uruchamiacza testów dla aplikacji."
            adb shell pm list instrumentation
            exit 1
          fi
          echo "Uruchamiacz testów: ${uruchamiacz}"
          adb shell am instrument -w "$uruchamiacz" | tee "$RUNNER_TEMP/instrumentacja.txt"
          # `am instrument` kończy się kodem 0 także przy porażce testów, więc wynik czytamy z wyjścia;
          # sukces bez żadnego testu też jest błędem.
          if ! grep -Eq '^OK \(([1-9][0-9]*) tests?\)' "$RUNNER_TEMP/instrumentacja.txt"; then
            echo "::error title=Testy na emulatorze::Brak wyniku OK z co najmniej jednym testem."
            exit 1
          fi
      - name: Zapisz logcat i log emulatora
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/raporty"
          adb logcat -d > "$RUNNER_TEMP/raporty/logcat.txt" || true
          cp "$RUNNER_TEMP/emulator.log" "$RUNNER_TEMP/raporty/" || true
          grep -E 'FATAL EXCEPTION|AndroidRuntime|TestRunner' "$RUNNER_TEMP/raporty/logcat.txt" | head -200 || true
      - name: Zapisz wynik testów na emulatorze
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: raporty-emulator-api-${{ matrix.api }}
          path: |
            ${{ runner.temp }}/instrumentacja.txt
            ${{ runner.temp }}/raporty/
          if-no-files-found: ignore

  apk:
    needs: zmiany
    if: ${{ !cancelled() && (needs.zmiany.result != 'success' || needs.zmiany.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 25
      - name: Odtwórz pobrane zależności i dystrybucje Gradle
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: >-
            android-zaleznosci-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('android/**/*.gradle.kts', 'android/**/gradle.properties', 'android/**/*.toml', 'android/**/gradle.lockfile', 'android/gradle/verification-metadata.xml', 'android/gradle/wrapper/gradle-wrapper.properties', '.github/workflows/android.yml') }}
          restore-keys: |
            android-zaleznosci-v1-${{ runner.os }}-${{ runner.arch }}-
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-provider: external
      - name: Zbuduj aplikację i testy na urządzenie
        run: ./gradlew assembleDebug assembleDebugAndroidTest
      - name: Pokaż zbudowane pakiety
        run: ls -l app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Udostępnij APK aplikacji i testów
        uses: actions/upload-artifact@v7.0.2
        with:
          name: apk-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7
