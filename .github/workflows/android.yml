name: android

on:
  pull_request:
    branches:
      - main
      - "sprint/**"
  push:
    branches:
      - main
      - "sprint/**"
    paths:
      - "android/**"
      - "data/buildings/**"
      - "api/openapi.yaml"
      - "docs/docs/ux/tokeny.yml"
      - ".github/workflows/android.yml"
      - ".github/actions/android-gradle/**"
      - ".github/scripts/cache-budowania-sprintu.sh"
      - ".github/scripts/cache-z-kolejki.sh"
      - ".github/scripts/czysc-cache.sh"
      - ".github/scripts/wyniki-androida.sh"
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  # Push po scaleniu tylko przekłada cache z grupy kolejki, więc każdy commit ma własną grupę i nic go nie anuluje.
  # Dla PR i grupy kolejki nowszy przebieg anuluje starszy.
  group: android-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  porownanie:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/drzewo-grupy.yml
    with:
      workflow: android.yml

  zmiany:
    # Także dla grupy kolejki: bez tego każda grupa budowała aplikację i uruchamiała emulatory, choć PR nie zmieniał Androida.
    # Gdy zadanie się nie powiedzie, pozostałe idą mimo to, a check `budowanie` jest czerwony.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.diff.outputs.android }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Sprawdź, czy PR albo grupa w kolejce zmienia aplikację Android, jej dane, tokeny albo własne kroki CI
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          from=HEAD^1
          to=HEAD
          if [[ $EVENT == merge_group ]]; then
            git fetch --no-tags --depth=1 origin "$GROUP_BASE_SHA"
            from=$GROUP_BASE_SHA
            to=$GROUP_HEAD_SHA
          fi
          if git diff --quiet "$from" "$to" -- android data/buildings api/openapi.yaml docs/docs/ux/tokeny.yml .github/workflows/android.yml \
            .github/actions/android-gradle .github/scripts/cache-budowania-sprintu.sh .github/scripts/cache-z-kolejki.sh .github/scripts/czysc-cache.sh .github/scripts/wyniki-androida.sh; then
            echo "android=false" >> "$GITHUB_OUTPUT"
          else
            echo "android=true" >> "$GITHUB_OUTPUT"
          fi

  emulator:
    needs: apk
    if: ${{ !cancelled() && github.event_name != 'push' && needs.apk.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Test systemowy dopiero zbiera historię stabilności, więc jego porażka nie czerwieni `budowanie`.
    continue-on-error: ${{ matrix.zestaw == 'system' }}
    strategy:
      fail-fast: false
      matrix:
        # Testy aplikacji na wersji minimalnej i docelowej z NFR-41; w grupie kolejki także test systemowy
        # (moduł `systemtest`) z serwerem i bazą uruchomionymi na runnerze.
        include: ${{ fromJSON(github.event_name == 'merge_group' && '[{"api":26,"zestaw":"aplikacja"},{"api":36,"zestaw":"aplikacja"},{"api":36,"zestaw":"system"}]' || '[{"api":26,"zestaw":"aplikacja"},{"api":36,"zestaw":"aplikacja"}]') }}
    env:
      IMAGE: system-images;android-${{ matrix.api }};default;x86_64
    steps:
      - uses: actions/checkout@v7.0.1
        if: matrix.zestaw == 'system'
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.2.0
        if: matrix.zestaw == 'system'
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Uruchom bazę, magazyn zdjęć, logowanie i serwer
        if: matrix.zestaw == 'system'
        timeout-minutes: 15
        run: |
          cp infra/.env.example infra/.env
          docker compose -f infra/docker-compose.yml up -d --wait
          (cd backend && ./mvnw -B -q -DskipTests -Dqulice.skip=true -Djacoco.skip=true package)
          set -a
          . infra/.env
          set +a
          jar="$(find backend/target -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' | head -n 1)"
          nohup java -jar "$jar" > "$RUNNER_TEMP/serwer.log" 2>&1 &
          if ! timeout 180 bash -c 'until curl -fs -o /dev/null http://127.0.0.1:8080/buildings; do sleep 3; done'; then
            echo "::error title=Test systemowy::Serwer nie odpowiedział na /buildings w 3 minuty."
            cat "$RUNNER_TEMP/serwer.log"
            exit 1
          fi
      - name: Pobierz APK aplikacji i testów
        uses: actions/download-artifact@v8.0.2
        with:
          name: apk-debug
          path: ${{ runner.temp }}/apk
      - name: Włącz KVM dla emulatora
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Uruchom emulator API ${{ matrix.api }}
        # Pobranie obrazu i start (do 10 min na uruchomienie systemu) mają twardy limit, żeby niewstały emulator nie blokował CI.
        timeout-minutes: 15
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/avd
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          (yes || true) | "$sdk/sdkmanager" --licenses > /dev/null
          "$sdk/sdkmanager" emulator platform-tools "$IMAGE" > /dev/null
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$sdk/avdmanager" create avd --force -n kampus -k "$IMAGE"
          "$ANDROID_HOME/emulator/emulator" -accel-check
          nohup "$ANDROID_HOME/emulator/emulator" -avd kampus -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect -camera-back none > "$RUNNER_TEMP/emulator.log" 2>&1 &
          if ! timeout 600 bash -c 'adb wait-for-device && until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 5; done'; then
            echo "::error title=Emulator::Emulator API ${{ matrix.api }} nie uruchomił się w 10 minut."
            cat "$RUNNER_TEMP/emulator.log"
            exit 1
          fi
          for scale in window_animation_scale transition_animation_scale animator_duration_scale; do
            adb shell settings put global "$scale" 0
          done
      - name: Zainstaluj APK aplikacji i testów
        timeout-minutes: 5
        env:
          ZESTAW: ${{ matrix.zestaw }}
        run: |
          # Artefakt zachowuje strukturę katalogów od najbliższego wspólnego przodka, więc pliki szukamy po nazwie.
          find "$RUNNER_TEMP/apk" -name '*.apk' -print
          adb install -r -t "$(find "$RUNNER_TEMP/apk" -name app-debug.apk | head -n 1)"
          testy=app-debug-androidTest.apk
          if [[ $ZESTAW == system ]]; then
            testy=systemtest-debug.apk
          fi
          adb install -r -t "$(find "$RUNNER_TEMP/apk" -name "$testy" | head -n 1)"
      - name: Testy na emulatorze
        timeout-minutes: 15
        run: |
          # Uruchamiacz testów (np. własny runner Hilt) odczytujemy z zainstalowanego APK testów, nie z konfiguracji workflow.
          uruchamiacz="$(adb shell pm list instrumentation | tr -d '\r' | sed -n 's/^instrumentation:\([^ ]*\) (target=io.github.dostepnykampus)$/\1/p' | head -n 1)"
          if [[ -z $uruchamiacz ]]; then
            echo "::error title=Testy na emulatorze::Nie znaleziono uruchamiacza testów dla aplikacji."
            adb shell pm list instrumentation
            exit 1
          fi
          echo "Uruchamiacz testów: ${uruchamiacz}"
          # Lista testów z APK (tryb `log`: bez wykonywania); każdy test idzie osobno, na czystych danych aplikacji,
          # więc wynik nie zależy od kolejności ani od stanu zostawionego przez poprzedni test.
          adb shell am instrument -w -r -e log true "$uruchamiacz" | tr -d '\r' |
            awk -F= '/^INSTRUMENTATION_STATUS: class=/ { klasa = $2 } /^INSTRUMENTATION_STATUS: test=/ { test = $2 }
              /^INSTRUMENTATION_STATUS_CODE:/ { if (klasa != "" && test != "") print klasa "#" test; klasa = ""; test = "" }' |
            sort -u > "$RUNNER_TEMP/lista-testow.txt"
          wszystkie="$(wc -l < "$RUNNER_TEMP/lista-testow.txt")"
          echo "Testy w APK: ${wszystkie}"
          cat "$RUNNER_TEMP/lista-testow.txt"
          : > "$RUNNER_TEMP/instrumentacja.txt"
          zaliczone=0
          while read -r test; do
            adb shell pm clear io.github.dostepnykampus < /dev/null
            adb shell am instrument -w -e class "$test" "$uruchamiacz" < /dev/null | tr -d '\r' | tee -a "$RUNNER_TEMP/instrumentacja.txt" > "$RUNNER_TEMP/wynik.txt"
            cat "$RUNNER_TEMP/wynik.txt"
            # `am instrument` kończy się kodem 0 także przy porażce testu, więc wynik czytamy z wyjścia.
            if grep -Eq '^OK \(1 test\)' "$RUNNER_TEMP/wynik.txt"; then
              zaliczone=$((zaliczone + 1))
            else
              echo "::error title=Testy na emulatorze::Test ${test} nie zakończył się wynikiem OK."
            fi
          done < "$RUNNER_TEMP/lista-testow.txt"
          echo "Zaliczone testy na emulatorze: ${zaliczone} z ${wszystkie}"
          if ((wszystkie == 0 || zaliczone != wszystkie)); then
            exit 1
          fi
      - name: Zapisz logcat i log emulatora
        if: failure()
        # Bez limitu `adb logcat -d` czeka w nieskończoność na urządzenie, które nie wstało.
        timeout-minutes: 2
        run: |
          mkdir -p "$RUNNER_TEMP/raporty"
          timeout 60 adb logcat -d > "$RUNNER_TEMP/raporty/logcat.txt" || true
          cp "$RUNNER_TEMP/emulator.log" "$RUNNER_TEMP/raporty/" || true
          cp "$RUNNER_TEMP/serwer.log" "$RUNNER_TEMP/raporty/" 2>/dev/null || true
          grep -E 'FATAL EXCEPTION|AndroidRuntime|TestRunner' "$RUNNER_TEMP/raporty/logcat.txt" | head -200 || true
      - name: Zapisz wynik testów na emulatorze
        if: always()
        uses: actions/upload-artifact@v7.0.2
        # Raport diagnostyczny: błąd zapisu artefaktu (np. awaria GitHuba) nie zmienia wyniku zadania (#1028).
        continue-on-error: true
        with:
          name: raporty-emulator-api-${{ matrix.api }}-${{ matrix.zestaw }}
          path: |
            ${{ runner.temp }}/instrumentacja.txt
            ${{ runner.temp }}/raporty/
          if-no-files-found: ignore

  apk:
    needs: [porownanie, zmiany]
    if: ${{ !cancelled() && github.event_name != 'push' && needs.porownanie.outputs.pomin != 'true' && (needs.zmiany.result != 'success' || needs.zmiany.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Przygotuj JDK i cache Gradle
        uses: ./.github/actions/android-gradle
      - name: Zbuduj aplikację i testy na urządzenie
        run: |
          set -o pipefail
          # --profile zapisuje raport czasu zadań Gradle (HTML); log zadań służy do policzenia FROM-CACHE, UP-TO-DATE i wykonanych.
          ./gradlew assembleDebug assembleDebugAndroidTest --profile --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle-apk.log"
      - name: Policz zadania Gradle według wyniku
        if: ${{ !cancelled() }}
        run: |
          log="$RUNNER_TEMP/gradle-apk.log"
          {
            echo "Zadania Gradle w jobie apk: wszystkie $(grep -c '^> Task ' "$log"), FROM-CACHE $(grep -c '^> Task .* FROM-CACHE$' "$log"), UP-TO-DATE $(grep -c '^> Task .* UP-TO-DATE$' "$log"), NO-SOURCE $(grep -c '^> Task .* NO-SOURCE$' "$log"), SKIPPED $(grep -c '^> Task .* SKIPPED$' "$log"), wykonane $(grep -c '^> Task [^ ]*$' "$log")"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          cp "$log" build/reports/profile/ 2>/dev/null || true
      - name: Udostępnij raport czasu Gradle
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        # Raport diagnostyczny: błąd zapisu artefaktu (np. awaria GitHuba) nie zmienia wyniku zadania (#1028).
        continue-on-error: true
        with:
          name: profil-apk
          path: android/build/reports/profile/
          if-no-files-found: warn
          retention-days: 7
      - name: Pokaż zbudowane pakiety
        run: |
          ls -l app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            systemtest/build/outputs/apk/debug/systemtest-debug.apk
      - name: Udostępnij APK aplikacji i testów
        uses: actions/upload-artifact@v7.0.2
        with:
          name: apk-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            android/systemtest/build/outputs/apk/debug/systemtest-debug.apk
          if-no-files-found: error
          retention-days: 7

  testy:
    needs: [porownanie, zmiany]
    if: ${{ !cancelled() && github.event_name != 'push' && needs.porownanie.outputs.pomin != 'true' && (needs.zmiany.result != 'success' || needs.zmiany.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Przygotuj JDK i cache Gradle
        id: gradle
        uses: ./.github/actions/android-gradle
      - name: Testy, lint, detekt, Kover i zrzuty Roborazzi
        run: |
          # check: testy jednostkowe wszystkich modułów i Kover; lint: wszystkie warianty (w tym lintJvm modułów JVM);
          # detekt: wszystkie zbiory źródeł; verifyRoborazziDebug włącza weryfikację zrzutów (nie należy do check).
          ./gradlew check lint verifyRoborazziDebug detekt detektDebug detektDebugUnitTest detektDebugAndroidTest detektMain detektTest detektRelease --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle.log"
      - name: Policz wykonane testy
        if: ${{ !cancelled() }}
        run: |
          liczba="$(find . -path '*/build/test-results/*' -name 'TEST-*.xml' -print0 |
            xargs -0 -r grep -h '<testsuite ' | grep -o ' tests="[0-9]*"' | tr -dc '0-9\n' | awk '{ s += $1 } END { print s + 0 }')"
          echo "Testy jednostkowe wszystkich modułów: ${liczba}" | tee -a "$GITHUB_STEP_SUMMARY"
          liczba_app="$(find app/build/test-results -name 'TEST-*.xml' -print0 2>/dev/null |
            xargs -0 -r grep -h '<testsuite ' | grep -o ' tests="[0-9]*"' | tr -dc '0-9\n' | awk '{ s += $1 } END { print s + 0 }')"
          echo "Testy jednostkowe :app: ${liczba_app}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ $liczba -eq 0 || $liczba_app -eq 0 ]]; then
            echo "::error title=Testy jednostkowe::Brak wykonanych testów (łącznie ${liczba}, :app ${liczba_app})."
            exit 1
          fi
      - name: Zbierz diagnostykę generowania Hilt i KSP po porażce
        if: failure()
        run: |
          # Bez powtarzania zadań: tylko kopia tego, co zostało po porażce (wyjście KSP i Hilt, listing, log Gradle i demona).
          mkdir -p "$RUNNER_TEMP/diagnostyka"
          cp -r app/build/generated/ksp app/build/generated/hilt "$RUNNER_TEMP/diagnostyka/" || true
          find app/build/generated/ksp app/build/generated/hilt app/build/tmp -type f 2>/dev/null | sort > "$RUNNER_TEMP/diagnostyka/lista.txt" || true
          cp "$RUNNER_TEMP/gradle.log" "$RUNNER_TEMP/diagnostyka/" || true
          cp ~/.gradle/daemon/*/daemon-*.out.log "$RUNNER_TEMP/diagnostyka/" || true
      - name: Zapisz diagnostykę Hilt i KSP
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        # Raport diagnostyczny: błąd zapisu artefaktu (np. awaria GitHuba) nie zmienia wyniku zadania (#1028).
        continue-on-error: true
        with:
          name: diagnostyka-hilt-ksp
          path: ${{ runner.temp }}/diagnostyka/
          if-no-files-found: ignore
          retention-days: 7
      - name: Zapisz raporty
        if: always()
        uses: actions/upload-artifact@v7.0.2
        # Raport diagnostyczny: błąd zapisu artefaktu (np. awaria GitHuba) nie zmienia wyniku zadania (#1028).
        continue-on-error: true
        with:
          name: raporty-testy
          path: android/**/build/reports/
          if-no-files-found: ignore
      - name: Udostępnij cache budowania zadaniu po scaleniu i następnym grupom kolejki
        # Cache zapisany w grupie kolejki należy do jej tymczasowej gałęzi, której inne przebiegi nie widzą; artefakt widzą.
        if: ${{ success() && github.event_name == 'merge_group' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gradle-build-cache
          path: ~/.gradle/caches/build-cache-1/
          if-no-files-found: warn
          retention-days: 3
      - name: Sprawdź, czy gałąź docelowa ma już cache tych zależności
        # Bez tego każda grupa kolejki po zmianie zależności wysyłałaby całe archiwum, choć cache gałęzi już je ma.
        id: zaleznosci-galezi
        if: ${{ success() && github.event_name == 'merge_group' && steps.gradle.outputs.trafienie-zaleznosci != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KLUCZ: ${{ steps.gradle.outputs.klucz-zaleznosci }}
          BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: |
          liczba="$(gh cache list --ref "$BASE_REF" --key "$KLUCZ" --json id --jq length)"
          echo "brak=$([[ $liczba == 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Spakuj pobrane zależności i dystrybucje Gradle
        # Archiwum tar zachowuje uprawnienia plików dystrybucji Gradle, których artefakt nie przenosi.
        if: ${{ success() && steps.zaleznosci-galezi.outputs.brak == 'true' }}
        run: tar -C "$HOME/.gradle" -cf "$RUNNER_TEMP/zaleznosci.tar" caches/modules-2 wrapper
      - name: Udostępnij pobrane zależności zadaniu po scaleniu
        if: ${{ success() && steps.zaleznosci-galezi.outputs.brak == 'true' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gradle-zaleznosci
          path: ${{ runner.temp }}/zaleznosci.tar
          if-no-files-found: error
          retention-days: 1

  cache:
    # Po scaleniu nic się nie buduje ani nie testuje: grupa kolejki sprawdziła ten sam commit. Zadanie przekłada cache
    # tej grupy z artefaktów do cache gałęzi, bo tylko cache gałęzi docelowej widzą przebiegi PR.
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/sprint/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Policz klucze cache Gradle
        id: gradle
        uses: ./.github/actions/android-gradle
        with:
          tylko-klucze: 'true'
      - name: Pobierz cache budowania z grupy kolejki commitów tego pusha
        id: budowanie
        if: ${{ steps.gradle.outputs.trafienie-budowania != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRZED: ${{ github.event.before }}
        run: bash .github/scripts/cache-z-kolejki.sh "$GITHUB_SHA" gradle-build-cache "$HOME/.gradle/caches/build-cache-1" "$PRZED"
      - name: Zapisz cache budowania Gradle
        if: ${{ steps.budowanie.outputs.jest == 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ steps.gradle.outputs.klucz-budowania }}
      - name: Pobierz zależności z grupy kolejki commitów tego pusha
        id: zaleznosci
        if: ${{ steps.gradle.outputs.trafienie-zaleznosci != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRZED: ${{ github.event.before }}
        run: bash .github/scripts/cache-z-kolejki.sh "$GITHUB_SHA" gradle-zaleznosci "$RUNNER_TEMP/zaleznosci" "$PRZED"
      - name: Rozpakuj zależności
        if: ${{ steps.zaleznosci.outputs.jest == 'true' }}
        run: mkdir -p "$HOME/.gradle" && tar -C "$HOME/.gradle" -xf "$RUNNER_TEMP/zaleznosci/zaleznosci.tar"
      - name: Zapisz pobrane zależności i dystrybucje Gradle
        if: ${{ steps.zaleznosci.outputs.jest == 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ steps.gradle.outputs.klucz-zaleznosci }}

  czyszczenie-cache:
    # Osobne małe zadanie tylko na push: uprawnienie actions: write nie trafia do zadań uruchamiających kod z PR.
    needs: cache
    if: ${{ !cancelled() && needs.cache.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            .github/scripts
            .github/actions/android-gradle/action.yml
          persist-credentials: false
      - name: Usuń poprzednie wpisy cache budowania i zależności tej gałęzi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Oba wpisy zapisuje zadanie cache (needs), więc czyszczenie rusza po udanym zapisie nowych.
          # Prefiksy są w akcji Gradle, żeby klucz nie był zapisany drugi raz.
          mapfile -t prefiks < <(sed -n 's/^# prefiks-cache: //p' .github/actions/android-gradle/action.yml)
          bash .github/scripts/czysc-cache.sh \
            "${prefiks[0]}${RUNNER_OS}-${RUNNER_ARCH}-" \
            "${prefiks[1]}${RUNNER_OS}-${RUNNER_ARCH}-"

  analiza-zaleznosci:
    # buildHealth kompiluje wszystkie moduły, więc działa po wypchnięciu na gałąź, nie w każdym PR i nie w grupie kolejki.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Przygotuj JDK i cache Gradle
        uses: ./.github/actions/android-gradle
      - name: Sprawdź, czy każdy moduł deklaruje biblioteki, których używa
        run: ./gradlew buildHealth --console=plain
      - name: Zapisz raport analizy zależności
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: analiza-zaleznosci
          path: android/build/reports/dependency-analysis/
          if-no-files-found: ignore
          retention-days: 7

  budowanie:
    needs: [porownanie, zmiany, testy, apk, emulator]
    # always(): także po anulowaniu poprzednich zadań, żeby anulowana część dawała czerwony check, a nie pominięty.
    # Gdy grupa kolejki ma drzewo sprawdzone na PR, wszystkie zadania są pominięte, więc i ten check (pominięty = zaliczony).
    if: ${{ always() && github.event_name != 'push' && needs.porownanie.outputs.pomin != 'true' && (needs.zmiany.result != 'success' || needs.zmiany.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Sprawdź wyniki wszystkich zadań Androida
        env:
          ZMIANY: ${{ needs.zmiany.result }}
          WYNIKI: ${{ needs.testy.result }} ${{ needs.apk.result }} ${{ needs.emulator.result }}
        run: bash .github/scripts/wyniki-androida.sh
