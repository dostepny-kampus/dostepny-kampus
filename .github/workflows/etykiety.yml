name: etykiety

# Zdarzenie pull_request (nie pull_request_target): PR z gałęzi tego repozytorium ma token z zapisem etykiet.
# PR z forków i PR Dependabota dostają token tylko do odczytu, więc ich nie etykietujemy.
on:
  pull_request:
    branches:
      - main
      - "sprint/**"
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

concurrency:
  group: etykiety-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  obszar:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Ustaw etykiety obszaru według zmienionych plików
        uses: actions/labeler@v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
