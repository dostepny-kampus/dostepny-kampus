name: pr-guard

on:
  pull_request:
    branches:
      - main
      - "sprint/**"
    types:
      - opened
      - synchronize
      - reopened
      - edited
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: pr-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  TYPOS_VERSION: 1.51.1
  TYPOS_SHA256: 93c301fd4120ff076e2cc2a6d6a61cab4a4bdb81899287c0938b452e56d1f454

jobs:
  # Lekkie kontrole w jednym zadaniu, żeby przebieg zajmował jedną maszynę. Każdy krok biegnie także po porażce
  # wcześniejszego (`!cancelled()`), więc przebieg pokazuje naraz wszystkie czerwone kontrole.
  # Kontrole danych PR (rozmiar, tytuł, zależności) przeszły na PR i w kolejce scalania nie są powtarzane.
  # Kontrole kodu pomija grupa kolejki z drzewem i tytułem równym w pełni zielonemu przebiegowi na PR (#726).
  pr-guard:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Na PR zapisuje drzewo scalenia, w grupie kolejki porównuje je z drzewem sprawdzonym na PR (pomin).
      - id: drzewo
        uses: ./.github/actions/drzewo-grupy
        with:
          workflow: pr-guard.yml

      - name: "rozmiar: policz zmienione linie"
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ $BASE_REF == main && $HEAD_REF =~ ^sprint/[0-9]+$ && $HEAD_REPO == "$GITHUB_REPOSITORY" ]]; then
            echo "Scalenie sprintu do main: każda zmiana przeszła limit w PR do gałęzi sprintu."
            exit 0
          fi
          bash .github/scripts/rozmiar-pr.sh "$BASE_SHA" "$HEAD_SHA" 400

      - uses: actions/setup-node@v7.1.0
        if: &kod ${{ !cancelled() && steps.drzewo.outputs.pomin != 'true' }}
        with:
          node-version: 24
          package-manager-cache: false

      # W kolejce scalania sprawdzamy commity grupy (base_sha..head_sha): komunikat commitu squash bierze tytuł PR,
      # który można zmienić jeszcze w kolejce.
      - name: "commity: zainstaluj commitlint z pliku lock"
        if: &commity ${{ !cancelled() && steps.drzewo.outputs.pomin != 'true' && github.event.pull_request.user.login != 'dependabot[bot]' }}
        working-directory: .github/commitlint
        run: npm ci --no-audit --no-fund
      - name: "commity: sprawdź komunikaty commitów"
        if: *commity
        working-directory: .github/commitlint
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          # Commit, który dodał commitlint; trzy wcześniejsze commity z PR #2 powstały przed tą kontrolą.
          COMMITLINT_START: 6cf5eac12b0aedff147d5d06e7394571936bcd8e
        run: |
          from=$BASE_SHA
          if [[ $BASE_REF == main && $HEAD_REF =~ ^sprint/[0-9]+$ && $HEAD_REPO == "$GITHUB_REPOSITORY" ]] &&
            git merge-base --is-ancestor "$COMMITLINT_START" "$HEAD_SHA" &&
            ! git merge-base --is-ancestor "$COMMITLINT_START" "$BASE_SHA"; then
            echo "Scalenie sprintu do main: commity sprawdzane od wprowadzenia commitlint."
            from=$COMMITLINT_START
          fi
          npx --no-install commitlint --from "$from" --to "$HEAD_SHA" --verbose
      - name: "commity: sprawdź tytuł PR z numerem dopisywanym przez squash"
        if: ${{ !cancelled() && steps.drzewo.outputs.pomin != 'true' && github.event_name != 'merge_group' && github.event.pull_request.user.login != 'dependabot[bot]' }}
        working-directory: .github/commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          # Kolejka robi squash z nagłówkiem „<tytuł> (#N)”, a przy jednym commicie z nagłówkiem tego commita (#1093),
          # więc sprawdzamy go już na PR, razem z dopiskiem.
          commit=''
          if [[ $PR_COMMITS == 1 ]]; then
            commit="$(git log -1 --format=%s "$HEAD_SHA")"
          fi
          bash ../scripts/naglowek-squasha.sh "$PR_TITLE" "$PR_NUMBER" "$commit"
          printf '%s (#%s)\n' "${commit:-$PR_TITLE}" "$PR_NUMBER" | npx --no-install commitlint --verbose

      - name: "zakazane-slowa: sprawdź gałąź, tytuł, opis, commity i dodane linie plików"
        if: *kod
        env:
          FORBIDDEN_PATTERNS: ${{ secrets.FORBIDDEN_PATTERNS }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: bash .github/scripts/zakazane-slowa.sh "$BASE_SHA" "$HEAD_SHA"

      - name: "zaleznosci: licencje i podatności nowych zależności"
        uses: actions/dependency-review-action@v5.0.0
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          allow-licenses: >-
            MIT, MIT-open-group, Apache-2.0, BSD-2-Clause, BSD-3-Clause, EPL-2.0, MPL-2.0, ISC,
            0BSD, PSF-2.0, Python-2.0
          allow-dependencies-licenses: pkg:pypi/language-tool-python, pkg:npm/bpmn-js, pkg:maven/org.junit.jupiter/junit-jupiter-api, pkg:maven/org.junit.jupiter/junit-jupiter-params, pkg:maven/org.junit.platform/junit-platform-suite, pkg:maven/org.junit.platform/junit-platform-suite-api, pkg:maven/org.springframework.modulith/spring-modulith-core, pkg:maven/org.springframework.modulith/spring-modulith-docs, pkg:maven/com.tngtech.archunit/archunit

      - name: "naglowki: sprawdź nagłówek autorski w plikach z kodem"
        if: *kod
        run: bash .github/scripts/naglowki.sh

      - name: "literowki: pobierz typos"
        if: *kod
        working-directory: ${{ runner.temp }}
        run: |
          archive="typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/crate-ci/typos/releases/download/v${TYPOS_VERSION}"
          curl -sSfLO --retry 5 --retry-all-errors --retry-delay 10 "${url}/${archive}"
          echo "${TYPOS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}"
      - name: "literowki: szukaj literówek w kodzie, skryptach, konfiguracji i Markdown poza docs/"
        if: *kod
        run: |
          if ! "${RUNNER_TEMP}/typos" --config .github/typos.toml --format brief; then
            echo "::error::Literówka wyżej: popraw ją albo dodaj wyjątek z powodem w .github/typos.toml."
            exit 1
          fi

      - name: "testy-skryptow: uruchom wszystkie testy skryptów z .github/scripts"
        if: *kod
        run: bash .github/scripts/testy-skryptow.sh

      - name: "kopie: zainstaluj jscpd z pliku lock"
        if: *kod
        working-directory: .github/jscpd
        run: npm ci --no-audit --no-fund
      - name: "kopie: szukaj skopiowanych fragmentów kodu, konfiguracji i skryptów"
        if: *kod
        run: |
          ignore="$(grep -v '^#' .github/jscpd/wyjatki.txt | cut -f1 | paste -sd, -)"
          if ! .github/jscpd/node_modules/.bin/jscpd --config .github/jscpd/jscpd.json --ignore "$ignore" .; then
            echo "::error::Skopiowany fragment: obie lokalizacje są w wyniku wyżej. Wydziel wspólną funkcję albo krok."
            exit 1
          fi

      - name: "baza-sprintu: sprawdź bazę gałęzi sprintu"
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          # Kontrolujemy gałąź sprintu, której dotyczy PR: bazową (PR do sprint/N) albo własną (scalenie sprint/N do main).
          # Komunikaty o braku gałęzi i numerze z zerem wiodącym zgłasza sam skrypt.
          branch=""
          if [[ $BASE_REF =~ ^sprint/[0-9]+$ ]]; then
            branch=$BASE_REF
          elif [[ $HEAD_REF =~ ^sprint/[0-9]+$ && $HEAD_REPO == "$GITHUB_REPOSITORY" ]]; then
            branch=$HEAD_REF
          fi
          if [[ -z $branch ]]; then
            echo "PR nie dotyczy gałęzi sprintu, kontrola bazy pominięta."
            exit 0
          fi
          bash .github/scripts/baza-sprintu.sh "$branch"

      - name: "znaczniki-todo: każdy znacznik zadania wskazuje otwarte issue"
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
        # Na PR znaczniki sprawdzamy w stanie po scaleniu z bieżącą głową gałęzi bazowej: znacznik zdjęty już
        # na bazie nie wywraca PR odgałęzionego wcześniej. Gałąź, która się nie scala, sprawdzamy w stanie z PR.
        run: |
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            baza="origin/${GITHUB_BASE_REF}"
            katalog="${RUNNER_TEMP}/po-scaleniu"
            git fetch --no-tags --quiet origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/${baza}"
            git worktree add --detach --quiet "$katalog" "$HEAD_SHA"
            if git -C "$katalog" -c user.name=straznik -c user.email=straznik@localhost merge --quiet --no-edit "$baza"; then
              cd "$katalog"
            else
              echo "Gałąź nie scala się z bazą; znaczniki sprawdzone w stanie z PR."
            fi
          fi
          bash .github/scripts/todo-issue.sh

      # Ostatni, bo usuwa z drzewa roboczego konfigurację gitleaks dodaną w PR.
      - name: "sekrety: pobierz gitleaks"
        if: *kod
        working-directory: ${{ runner.temp }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO --retry 5 --retry-all-errors --retry-delay 10 "${url}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
      - name: "sekrety: skanuj commity PR"
        if: *kod
        run: |
          rm -f .gitleaks.toml .gitleaksignore
          "${RUNNER_TEMP}/gitleaks" git --no-banner --redact --verbose \
            --ignore-gitleaks-allow --log-opts="${BASE_SHA}..${HEAD_SHA}" .
