name: dependabot-sprint

# Co godzinę i na żądanie: otwarte PR Dependabota bez kamienia milowego dostają bazę na bieżący sprint i kamień
# milowy. Zdarzenia PR nie wystarczą: PR Dependabota dostaje token tylko do odczytu, a GitHub wyłącza domyślnie
# pull_request_target w repozytoriach publicznych (#2757). Kodu PR nie pobieramy ani nie uruchamiamy.
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependabot-sprint
  cancel-in-progress: false

jobs:
  baza-i-kamien:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Przestaw bazę na bieżący sprint i ustaw kamień milowy
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: dependabot[bot]
        run: |
          prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --app dependabot --state open --limit 100 \
            --json number,milestone --jq '.[] | select(.milestone == null) | .number')"
          for pr in $prs; do
            bash .github/scripts/dependabot-sprint.sh "$pr"
          done
