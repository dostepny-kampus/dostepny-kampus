name: backend

on:
  pull_request:
    branches:
      - main
      - "sprint/**"
  push:
    branches:
      - main
      - "sprint/**"
    paths:
      - "backend/**"
      - "data/**"
      - "api/openapi.yaml"
      - "specs/**"
      - "infra/**"
      - ".github/workflows/backend.yml"
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  porownanie:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/drzewo-grupy.yml
    with:
      workflow: backend.yml

  zmiany:
    needs: porownanie
    if: ${{ !cancelled() && needs.porownanie.outputs.pomin != 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      serwer: ${{ steps.diff.outputs.serwer }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Sprawdź, czy PR albo grupa w kolejce zmienia serwer albo pliki, które czytają jego testy
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          from=HEAD^1
          to=HEAD
          if [[ $EVENT == merge_group ]]; then
            git fetch --no-tags --depth=1 origin "$GROUP_BASE_SHA"
            from=$GROUP_BASE_SHA
            to=$GROUP_HEAD_SHA
          fi
          if git diff --quiet "$from" "$to" -- backend data api/openapi.yaml specs infra .github/workflows/backend.yml; then
            echo "serwer=false" >> "$GITHUB_OUTPUT"
          else
            echo "serwer=true" >> "$GITHUB_OUTPUT"
          fi

  serwer:
    needs: [porownanie, zmiany]
    if: ${{ !cancelled() && needs.porownanie.outputs.pomin != 'true' && (needs.zmiany.result != 'success' || needs.zmiany.outputs.serwer == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Testy skryptów danych
        if: ${{ github.event_name != 'push' }}
        working-directory: data/scripts
        run: python3 -X utf8 -m unittest discover -s tests -v
      - name: Zbuduj, przetestuj i sprawdź qulice
        if: ${{ github.event_name != 'push' }}
        run: ./mvnw -B verify
      - name: Testy mutacyjne PIT dziedziny serwera
        # Po verify kod i testy są już skompilowane; PIT działa przed scaleniem, w PR i w grupie kolejki.
        if: ${{ github.event_name != 'push' }}
        run: |
          ./mvnw -B -q -Dqulice.skip=true -Djacoco.skip=true test-compile
          for cele in 'io.github.dostepnykampus.*.domain.*' 'io.github.dostepnykampus.barrier.[A-Z]*'             'io.github.dostepnykampus.barrier.json.*' 'io.github.dostepnykampus.barrier.web.*'             'io.github.dostepnykampus.barrier.persistence.*' 'io.github.dostepnykampus.building.[A-Z]*'             'io.github.dostepnykampus.building.locate.*' 'io.github.dostepnykampus.building.postgis.*'             'io.github.dostepnykampus.[A-Z]*' 'io.github.dostepnykampus.identity.*'; do
            rm -rf target/pit-reports
            start=$SECONDS
            ./mvnw -B -q -Dqulice.skip=true -Djacoco.skip=true "-Dpit.cele=$cele" org.pitest:pitest-maven:mutationCoverage || true
            czas=$((SECONDS - start))
            f=target/pit-reports/mutations.xml
            wynik="$(grep -o 'status=.[A-Z_]*' "$f" 2>/dev/null | sort | uniq -c | tr '
' ' ' || true)"
            klasy="$(grep -o '<mutatedClass>[^<]*' "$f" 2>/dev/null | sed 's/<mutatedClass>//' | sort | uniq -c | tr '
' ' ' || true)"
            echo "POMIAR | $cele | ${czas}s | $wynik" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "KLASY | $cele | $klasy" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            grep -B0 "status='SURVIVED'\|status='NO_COVERAGE'" "$f" 2>/dev/null | grep -o "<mutatedClass>[^<]*\|<lineNumber>[^<]*\|<description>[^<]*" | paste - - - | sed 's/<[a-zA-Z]*>//g' | head -60 || true
            mkdir -p "target/pomiar/$((++n))" && cp -r target/pit-reports/. "target/pomiar/$n/" 2>/dev/null || true
          done
      - name: Raport PIT
        if: ${{ !cancelled() && github.event_name != 'push' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pit-raport
          path: backend/target/pomiar
          if-no-files-found: ignore
          retention-days: 14
      - name: Pobierz zależności do cache Maven
        # Na push po scaleniu z kolejki kontrole przeszły już w merge_group na tym samym SHA; tu tylko zapis cache zależności.
        if: ${{ github.event_name == 'push' }}
        run: ./mvnw -B -DskipTests test-compile

  jakosc:
    needs: [porownanie, zmiany]
    if: ${{ !cancelled() && needs.porownanie.outputs.pomin != 'true' && github.event_name != 'push' && (needs.zmiany.result != 'success' || needs.zmiany.outputs.serwer == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Sprawdź qulice niezależnie od wyniku testów
        run: ./mvnw -B -DskipTests test-compile qulice:check
