name: backend

on:
  pull_request:
    branches:
      - main
      - "sprint/**"
  push:
    branches:
      - main
      - "sprint/**"
    paths:
      - "backend/**"
      - "data/**"
      - "api/openapi.yaml"
      - "specs/**"
      - "infra/**"
      - ".github/workflows/backend.yml"
      - ".github/scripts/wynik-pit.sh"
      - ".github/scripts/mvn-z-ponowieniem.sh"
      - ".github/scripts/zmiany-obszaru.sh"
      - ".github/actions/java-serwera/**"
  merge_group:
    types:
      - checks_requested
  workflow_call:
    # Kontrola sprintu (kontrola-sprintu.yml): tylko PIT na wskazanym commicie gałęzi sprintu.
    inputs:
      sha:
        description: Commit gałęzi sprintu do sprawdzenia
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Kontrola sprintu ma grupę sprawdzanego commita, żeby nie czekać na przebiegi tej samej gałęzi.
  group: backend-${{ inputs.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zmiany:
    # Nieudane `zmiany` uruchamia kontrole w pełni. Równe drzewo grupy (pomin) je pomija.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pomin: ${{ steps.drzewo.outputs.pomin }}
      serwer: ${{ steps.diff.outputs.serwer }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: drzewo
        uses: ./.github/actions/drzewo-grupy
        with:
          workflow: backend.yml
      - name: Sprawdź, czy PR albo grupa w kolejce zmienia serwer albo pliki, które czytają jego testy
        id: diff
        if: steps.drzewo.outputs.pomin != 'true'
        env:
          EVENT: ${{ github.event_name }}
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: >-
          .github/scripts/zmiany-obszaru.sh serwer backend data api/openapi.yaml specs infra
          .github/workflows/backend.yml .github/scripts/wynik-pit.sh .github/scripts/mvn-z-ponowieniem.sh
          .github/scripts/zmiany-obszaru.sh
          .github/actions/java-serwera

  serwer:
    # `mutacje` w needs: jego porażka w kontroli sprintu przechodzi przez wymagany job (na PR jest pominięty).
    needs: [zmiany, mutacje]
    if: ${{ !cancelled() && !inputs.sha && needs.zmiany.outputs.pomin != 'true' && (needs.zmiany.result != 'success' || needs.zmiany.outputs.serwer == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/java-serwera
      - name: Zależności skryptów danych
        if: ${{ github.event_name != 'push' }}
        run: python3 -m pip install --no-input -r ../data/requirements.txt
      - name: Testy skryptów danych
        if: ${{ github.event_name != 'push' }}
        working-directory: data/scripts
        run: python3 -X utf8 -m unittest discover -s tests -v
      - name: Zbuduj, przetestuj i sprawdź qulice
        if: ${{ github.event_name != 'push' }}
        run: bash ../.github/scripts/mvn-z-ponowieniem.sh -B verify
      - name: Testy mutacyjne PIT dziedziny serwera
        # Na PR; w grupie kolejki PIT nie padał, więc po scaleniu biegnie w kontroli sprintu (zadanie `mutacje`).
        if: ${{ github.event_name == 'pull_request' }}
        # Bez zestawów scenariuszy PIT trwa około minuty; kilka razy dłuższy przebieg to błąd do zbadania, nie czekanie.
        timeout-minutes: 8
        run: &pit |
          status=0
          ./mvnw -B -Dqulice.skip=true -Djacoco.skip=true test-compile org.pitest:pitest-maven:mutationCoverage || status=$?
          bash ../.github/scripts/wynik-pit.sh "$status" target/pit-reports/mutations.xml
      - name: Raport PIT
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7.0.2
        # Raport diagnostyczny: błąd zapisu artefaktu (np. awaria GitHuba) nie zmienia wyniku zadania (#1028).
        continue-on-error: true
        with: &pit-raport
          name: pit-raport
          path: backend/target/pit-reports
          if-no-files-found: ignore
          retention-days: 14
      - name: Pobierz zależności do cache Maven
        # Na push po scaleniu z kolejki kontrole przeszły już w merge_group na tym samym SHA; tu tylko zapis cache zależności.
        if: ${{ github.event_name == 'push' }}
        run: ./mvnw -B -DskipTests test-compile

  mutacje:
    # Tylko kontrola sprintu (inputs.sha): PIT na połączonych zmianach kilku PR po scaleniu.
    if: ${{ inputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/java-serwera
      - name: Testy mutacyjne PIT dziedziny serwera
        timeout-minutes: 8
        run: *pit
      - name: Raport PIT
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        continue-on-error: true
        with: *pit-raport

  jakosc:
    needs: zmiany
    if: &warunek-jakosc ${{ !cancelled() && !inputs.sha && needs.zmiany.outputs.pomin != 'true' && github.event_name != 'push' && (needs.zmiany.result != 'success' || needs.zmiany.outputs.serwer == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/java-serwera
      - name: Sprawdź qulice niezależnie od wyniku testów
        run: bash ../.github/scripts/mvn-z-ponowieniem.sh -B -DskipTests test-compile qulice:check

  spojnosc:
    # Raport spójności klas (jpeek) jako artefakt; próg dla klas ustalimy po sprincie (#1698).
    # Gdy raport nie powstał, zadanie jest czerwone.
    needs: zmiany
    if: *warunek-jakosc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JPEEK_VERSION: 0.32.3
      JPEEK_SHA256: 34e138f402c99386c36477300e8c9e2df90014ffb544855b47b03caa975c8598
      # jpeek ma w środku ASM bez obsługi klas Javy 25; nowszy ASM stoi w ścieżce klas przed nim.
      ASM_VERSION: 9.10.1
      ASM_SHA256: ed825d10ab1399c8c0cb669e688cf0c8c82629b4c8399b58352b68e92ca10fcb
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/java-serwera
      - name: Skompiluj kod serwera
        run: bash ../.github/scripts/mvn-z-ponowieniem.sh -B -DskipTests -Dqulice.skip=true compile
      - name: Pobierz jpeek i ASM
        working-directory: ${{ runner.temp }}
        run: |
          jar="jpeek-${JPEEK_VERSION}-jar-with-dependencies.jar"
          curl -sSfLO "https://repo1.maven.org/maven2/org/jpeek/jpeek/${JPEEK_VERSION}/${jar}"
          echo "${JPEEK_SHA256}  ${jar}" | sha256sum --check --strict
          mv "${jar}" jpeek.jar
          asm="asm-${ASM_VERSION}.jar"
          curl -sSfLO "https://repo1.maven.org/maven2/org/ow2/asm/asm/${ASM_VERSION}/${asm}"
          echo "${ASM_SHA256}  ${asm}" | sha256sum --check --strict
          mv "${asm}" asm.jar
      - name: Policz spójność klas
        run: >-
          java -cp "${RUNNER_TEMP}/asm.jar:${RUNNER_TEMP}/jpeek.jar" org.jpeek.Main
          --sources target/classes --target target/jpeek --overwrite
      - name: Raport jpeek
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        continue-on-error: true
        with:
          name: jpeek-raport
          path: backend/target/jpeek
          if-no-files-found: ignore
          retention-days: 14
