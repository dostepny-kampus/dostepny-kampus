name: backend

on:
  pull_request:
    branches:
      - main
      - "sprint/**"
  push:
    branches:
      - main
      - "sprint/**"
    paths:
      - "backend/**"
      - "data/**"
      - "api/openapi.yaml"
      - "specs/**"
      - "infra/**"
      - ".github/workflows/backend.yml"
      - ".github/scripts/wynik-pit.sh"
      - ".github/scripts/zmiany-obszaru.sh"
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  porownanie:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/drzewo-grupy.yml
    with:
      workflow: backend.yml

  zmiany:
    needs: porownanie
    if: ${{ !cancelled() && needs.porownanie.outputs.pomin != 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      serwer: ${{ steps.diff.outputs.serwer }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Sprawdź, czy PR albo grupa w kolejce zmienia serwer albo pliki, które czytają jego testy
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: >-
          .github/scripts/zmiany-obszaru.sh serwer backend data api/openapi.yaml specs infra
          .github/workflows/backend.yml .github/scripts/wynik-pit.sh .github/scripts/zmiany-obszaru.sh

  serwer:
    needs: [porownanie, zmiany]
    if: ${{ !cancelled() && needs.porownanie.outputs.pomin != 'true' && (needs.zmiany.result != 'success' || needs.zmiany.outputs.serwer == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: backend/pom.xml
          # Zapis tylko z pusha do sprintu: kopie PR i kolejki wypierały jego wpis.
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Testy skryptów danych
        if: ${{ github.event_name != 'push' }}
        working-directory: data/scripts
        run: python3 -X utf8 -m unittest discover -s tests -v
      - name: Zbuduj, przetestuj i sprawdź qulice
        if: ${{ github.event_name != 'push' }}
        run: ./mvnw -B verify
      - name: Testy mutacyjne PIT dziedziny serwera
        # Po verify kod i testy są już skompilowane; PIT działa przed scaleniem, w PR i w grupie kolejki.
        if: ${{ github.event_name != 'push' }}
        run: |
          status=0
          ./mvnw -B -Dqulice.skip=true -Djacoco.skip=true test-compile org.pitest:pitest-maven:mutationCoverage || status=$?
          bash ../.github/scripts/wynik-pit.sh "$status" target/pit-reports/mutations.xml
      - name: Raport PIT
        if: ${{ !cancelled() && github.event_name != 'push' }}
        uses: actions/upload-artifact@v7.0.2
        # Raport diagnostyczny: błąd zapisu artefaktu (np. awaria GitHuba) nie zmienia wyniku zadania (#1028).
        continue-on-error: true
        with:
          name: pit-raport
          path: backend/target/pit-reports
          if-no-files-found: ignore
          retention-days: 14
      - name: Pobierz zależności do cache Maven
        # Na push po scaleniu z kolejki kontrole przeszły już w merge_group na tym samym SHA; tu tylko zapis cache zależności.
        if: ${{ github.event_name == 'push' }}
        run: ./mvnw -B -DskipTests test-compile

  jakosc:
    needs: [porownanie, zmiany]
    if: ${{ !cancelled() && needs.porownanie.outputs.pomin != 'true' && github.event_name != 'push' && (needs.zmiany.result != 'success' || needs.zmiany.outputs.serwer == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: backend/pom.xml
          # Zapis tylko z pusha do sprintu: kopie PR i kolejki wypierały jego wpis.
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Sprawdź qulice niezależnie od wyniku testów
        run: ./mvnw -B -DskipTests test-compile qulice:check

  spojnosc:
    # Raport spójności klas (jpeek) jako artefakt; próg dla klas ustalimy po sprincie (#1698).
    # Gdy raport nie powstał, zadanie jest czerwone.
    needs: [porownanie, zmiany]
    if: ${{ !cancelled() && needs.porownanie.outputs.pomin != 'true' && github.event_name != 'push' && (needs.zmiany.result != 'success' || needs.zmiany.outputs.serwer == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JPEEK_VERSION: 0.32.3
      JPEEK_SHA256: 34e138f402c99386c36477300e8c9e2df90014ffb544855b47b03caa975c8598
      # jpeek ma w środku ASM bez obsługi klas Javy 25; nowszy ASM stoi w ścieżce klas przed nim.
      ASM_VERSION: 9.10.1
      ASM_SHA256: ed825d10ab1399c8c0cb669e688cf0c8c82629b4c8399b58352b68e92ca10fcb
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: backend/pom.xml
          cache-read-only: true
      - name: Skompiluj kod serwera
        run: ./mvnw -B -DskipTests -Dqulice.skip=true compile
      - name: Pobierz jpeek i ASM
        working-directory: ${{ runner.temp }}
        run: |
          jar="jpeek-${JPEEK_VERSION}-jar-with-dependencies.jar"
          curl -sSfLO "https://repo1.maven.org/maven2/org/jpeek/jpeek/${JPEEK_VERSION}/${jar}"
          echo "${JPEEK_SHA256}  ${jar}" | sha256sum --check --strict
          mv "${jar}" jpeek.jar
          asm="asm-${ASM_VERSION}.jar"
          curl -sSfLO "https://repo1.maven.org/maven2/org/ow2/asm/asm/${ASM_VERSION}/${asm}"
          echo "${ASM_SHA256}  ${asm}" | sha256sum --check --strict
          mv "${asm}" asm.jar
      - name: Policz spójność klas
        run: >-
          java -cp "${RUNNER_TEMP}/asm.jar:${RUNNER_TEMP}/jpeek.jar" org.jpeek.Main
          --sources target/classes --target target/jpeek --overwrite
      - name: Raport jpeek
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        continue-on-error: true
        with:
          name: jpeek-raport
          path: backend/target/jpeek
          if-no-files-found: ignore
          retention-days: 14
