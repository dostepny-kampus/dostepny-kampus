name: backend

on:
  pull_request:
    branches:
      - main
      - "sprint/**"
  push:
    branches:
      - main
      - "sprint/**"
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zmiany:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      serwer: ${{ steps.diff.outputs.serwer }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Sprawdź, czy PR albo grupa w kolejce zmienia serwer
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          from=HEAD^1
          to=HEAD
          if [[ $EVENT == merge_group ]]; then
            git fetch --no-tags --depth=1 origin "$GROUP_BASE_SHA"
            from=$GROUP_BASE_SHA
            to=$GROUP_HEAD_SHA
          fi
          if git diff --quiet "$from" "$to" -- backend .github/workflows/backend.yml; then
            echo "serwer=false" >> "$GITHUB_OUTPUT"
          else
            echo "serwer=true" >> "$GITHUB_OUTPUT"
          fi

  serwer:
    needs: zmiany
    if: ${{ !cancelled() && (needs.zmiany.result != 'success' || needs.zmiany.outputs.serwer == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Zbuduj, przetestuj i sprawdź qulice
        if: ${{ github.event_name != 'push' }}
        run: ./mvnw -B verify
      - name: Pobierz zależności do cache Maven
        # Na push po scaleniu z kolejki kontrole przeszły już w merge_group na tym samym SHA; tu tylko zapis cache zależności.
        if: ${{ github.event_name == 'push' }}
        run: ./mvnw -B -DskipTests test-compile

  jakosc:
    needs: zmiany
    if: ${{ !cancelled() && github.event_name != 'push' && (needs.zmiany.result != 'success' || needs.zmiany.outputs.serwer == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Sprawdź qulice niezależnie od wyniku testów
        run: ./mvnw -B -DskipTests test-compile qulice:check
