# milestone: numer kamienia milowego „Sprint N” (gh api repos/<repo>/milestones); przy otwarciu sprintu zmieniamy go razem z target-branch.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: sprint/4
    milestone: 1
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

