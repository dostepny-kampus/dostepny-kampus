name: Java serwera
description: JDK 25 i cache zależności Maven serwera; cache zapisuje tylko push do gałęzi, a zależności spoza cache w PR i kolejce pochodzą z Maven Central z ponowieniami przy 429 i 503 według backend/.mvn/maven.config.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6.2.0
      with:
        distribution: temurin
        java-version: 25
        cache: maven
        cache-dependency-path: backend/pom.xml
        # Zapis tylko z pusha do sprintu: kopie PR i kolejki wypierały jego wpis.
        cache-read-only: ${{ github.event_name != 'push' }}
