# Kod generowany (build/generated) jest w analizie typów, ale bez uwag: nikt go nie pisze ani nie commituje.
comments:
  excludes: ['**/build/generated/**']
  DocumentationOverPrivateFunction:
    active: true
  DocumentationOverPrivateProperty:
    active: true
  AbsentOrWrongFileLicense:
    licenseTemplateIsRegex: true
    licenseTemplate: |
      /\*
       \* Dostępny Kampus
       \* Author: (?![^\r\n]*(Vladyslav Yevkov|Myroslav Hryniuka|Yevhenii Lukianenko)[^\r\n]*\1)(?:Vladyslav Yevkov|Myroslav Hryniuka|Yevhenii Lukianenko)(?:, (?:Vladyslav Yevkov|Myroslav Hryniuka|Yevhenii Lukianenko)){0,2}
       \* Copyright \(c\) 2026 Vladyslav Yevkov, Myroslav Hryniuka, Yevhenii Lukianenko
       \*/

ktlint:
  excludes: ['**/build/generated/**']
  code_style: 'ktlint_official'
  FunctionSignature:
    functionBodyExpressionWrapping: 'multiline'
  FunctionName:
    # Dubluje naming>FunctionNaming, a w detekt nie ma opcji pominięcia @Composable,
    # którą wymaga dokumentacja compose-rules. Nazwy funkcji sprawdza FunctionNaming.
    active: false

naming:
  excludes: ['**/build/generated/**']
  FunctionNaming:
    ignoreAnnotated: ['Composable']

complexity:
  excludes: ['**/build/generated/**']
  LongParameterList:
    ignoreAnnotated: ['Composable']

Compose:
  excludes: ['**/build/generated/**']
  CompositionLocalAllowlist:
    # Role tokenów spoza Material 3 (kolory oznaczeń wejścia i mapy) dostarcza motyw, jak MaterialTheme.
    # Część V1 zasłoniętą przez arkusz V2 podaje scena arkusza ekranowi pod nim (LocalSheetPadding w :app).
    # Wątek czytania podglądu zdjęć podmieniają testy, żeby nie czekać oknem zegara (LocalPhotoDecodeContext, #622).
    allowedCompositionLocals: ['LocalStatusColors', 'LocalMapColors', 'LocalSheetPadding', 'LocalPhotoDecodeContext']

coroutines:
  excludes: ['**/build/generated/**']

empty-blocks:
  excludes: ['**/build/generated/**']

exceptions:
  excludes: ['**/build/generated/**']

performance:
  excludes: ['**/build/generated/**']

potential-bugs:
  excludes: ['**/build/generated/**']

style:
  excludes: ['**/build/generated/**']
  # Moduły z explicitApi() wymagają jawnego `public`, a widoczność w nich sprawdza kompilator. Detekt nie widzi
  # trybu jawnego API i uznaje ten modyfikator za zbędny. Lista rośnie razem z modułami w trybie jawnego API.
  RedundantVisibilityModifier:
    excludes: ['**/build/generated/**', '**/core/model/**', '**/core/database/**']
  # Tekst JSON powstaje i jest czytany tylko w plikach granicznych (NFR-46). Osobny egzemplarz reguły, więc
  # domyślna lista ForbiddenMethodCall działa dalej wszędzie. Wyjątki to ścieżki plików, nie pakiety; lista
  # może tylko maleć. Wywołanie toString na typie JsonElement kompilator widzi jako Any.toString, więc reguła
  # łapie je tylko dla typów JsonObject, JsonArray i JsonPrimitive.
  ForbiddenMethodCall/tekst-json:
    active: true
    excludes:
      - '**/build/generated/**'
      # Testy porównują tekst JSON z oczekiwanym i czytają odpowiedzi atrap serwera.
      - '**/src/test/**'
      - '**/src/testDebug/**'
      - '**/src/androidTest/**'
      # Klient sieci: treść żądań i odpowiedzi HTTP.
      - '**/core/network/src/main/kotlin/io/github/dostepnykampus/core/network/BuildingsApi.kt'
      - '**/core/network/src/main/kotlin/io/github/dostepnykampus/core/network/SubmissionJson.kt'
      # Kodek pamięci podręcznej: dokument JSON w wierszu building_cache.
      - '**/core/data/src/main/kotlin/io/github/dostepnykampus/core/data/buildings/BuildingCacheCodec.kt'
      # Styl mapy: MapLibre przyjmuje styl tylko jako tekst (#806, #809, #828).
      - '**/feature/map/src/main/kotlin/io/github/dostepnykampus/feature/map/style/CampusMapStyle.kt'
    methods:
      - reason: 'Tekst JSON poza plikiem granicznym. Użyj typów GeoJSON z biblioteki albo przenieś zamianę do pliku granicznego.'
        value: 'org.maplibre.android.maps.Style.Builder.fromJson'
      - reason: 'Tekst JSON poza plikiem granicznym. Użyj typów GeoJSON z biblioteki albo przenieś zamianę do pliku granicznego.'
        value: 'kotlinx.serialization.json.Json.encodeToString'
      - reason: 'Tekst JSON poza plikiem granicznym. Użyj typów GeoJSON z biblioteki albo przenieś zamianę do pliku granicznego.'
        value: 'kotlinx.serialization.encodeToString'
      - reason: 'Tekst JSON poza plikiem granicznym. Użyj typów GeoJSON z biblioteki albo przenieś zamianę do pliku granicznego.'
        value: 'kotlinx.serialization.json.Json.decodeFromString'
      - reason: 'Tekst JSON poza plikiem granicznym. Użyj typów GeoJSON z biblioteki albo przenieś zamianę do pliku granicznego.'
        value: 'kotlinx.serialization.decodeFromString'
      - reason: 'Tekst JSON poza plikiem granicznym. Użyj typów GeoJSON z biblioteki albo przenieś zamianę do pliku granicznego.'
        value: 'kotlinx.serialization.json.Json.parseToJsonElement'
      - reason: 'Tekst JSON poza plikiem granicznym. Użyj typów GeoJSON z biblioteki albo przenieś zamianę do pliku granicznego.'
        value: 'kotlinx.serialization.json.JsonObject.toString'
      - reason: 'Tekst JSON poza plikiem granicznym. Użyj typów GeoJSON z biblioteki albo przenieś zamianę do pliku granicznego.'
        value: 'kotlinx.serialization.json.JsonArray.toString'
      - reason: 'Tekst JSON poza plikiem granicznym. Użyj typów GeoJSON z biblioteki albo przenieś zamianę do pliku granicznego.'
        value: 'kotlinx.serialization.json.JsonPrimitive.toString'

