[versions]
agp = "9.5.0"
kotlin = "2.4.21"
detekt = "2.0.0-alpha.6"
composeRules = "0.6.8"
moduleGraphAssert = "2.9.1"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
konsist = "0.18.1"
junit = "6.1.3"
spatialk = "0.8.0"
snakeyamlEngine = "3.2"
