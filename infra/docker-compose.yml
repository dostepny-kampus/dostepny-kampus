name: dostepny-kampus

services:
  postgis:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: ${DK_DB_NAME:?ustaw DK_DB_NAME w infra/.env}
      POSTGRES_USER: ${DK_DB_USER:?ustaw DK_DB_USER w infra/.env}
      POSTGRES_PASSWORD: ${DK_DB_PASSWORD:?ustaw DK_DB_PASSWORD w infra/.env}
    ports:
      - "127.0.0.1:${DK_DB_PORT:-5432}:5432"
    volumes:
      - postgis-dane:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  zdjecia:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${DK_PHOTOS_ACCESS_KEY:?ustaw DK_PHOTOS_ACCESS_KEY w infra/.env}
      RUSTFS_SECRET_KEY: ${DK_PHOTOS_SECRET_KEY:?ustaw DK_PHOTOS_SECRET_KEY w infra/.env}
    ports:
      - "127.0.0.1:${DK_PHOTOS_PORT:-9000}:9000"
    volumes:
      - zdjecia-dane:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
  logowanie:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--http-port=8180", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${DK_AUTH_ADMIN_USER:?ustaw DK_AUTH_ADMIN_USER w infra/.env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${DK_AUTH_ADMIN_PASSWORD:?ustaw DK_AUTH_ADMIN_PASSWORD w infra/.env}
    ports:
      - "127.0.0.1:${DK_AUTH_PORT:-8180}:8180"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s
    restart: unless-stopped

volumes:
  postgis-dane:
  zdjecia-dane:
