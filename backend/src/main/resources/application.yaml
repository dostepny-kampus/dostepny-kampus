dk:
  photos:
    access-key: ${DK_PHOTOS_ACCESS_KEY:}
    bucket: ${DK_PHOTOS_BUCKET:zdjecia}
    endpoint: http://${DK_PHOTOS_HOST:127.0.0.1}:${DK_PHOTOS_PORT:9000}
    secret-key: ${DK_PHOTOS_SECRET_KEY:}
spring:
  application:
    name: dostepny-kampus
  datasource:
    password: ${DK_DB_PASSWORD:}
    url: jdbc:postgresql://${DK_DB_HOST:127.0.0.1}:${DK_DB_PORT:5432}/${DK_DB_NAME:dostepny_kampus}
    username: ${DK_DB_USER:dostepny_kampus}
  modulith:
    runtime:
      # TODO(#1719) migracje Java budynków trafiają też do historii modułów z własnymi migracjami
      flyway-enabled: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${DK_AUTH_ISSUER:http://localhost:8180/realms/dostepny-kampus}
